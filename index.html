    document.addEventListener('visibilitychange', () => { if (tracking && document.visibilityState === 'visible') keepAwake(true); });

    function startTracking() {
      stopFly();
      openDirBox();
      if (!navigator.geolocation) { dirResult.innerHTML = '<p class="dir-warn">⚠ Your browser does not support location.</p>'; return; }
      if (!dirTo.value) { dirResult.innerHTML = '<p class="dir-hint">Choose a destination (B) first, then start live tracking.</p>'; return; }
      if (watchId !== null) return;
      tracking = true; follow = true; lastTick = null;
      lastVoiceKey = ''; voiceNowSaid = false;
      speak('Live directions started');                        // this runs from your tap, so the phone allows the voice
      stepsOpen = window.innerWidth > 700;          // keep the phone panel small: steps stay folded while walking
      keepAwake(true);
      dirResult.innerHTML = '<p class="dir-hint">📡 Finding your location... allow location access if your browser asks.</p>';
      watchId = navigator.geolocation.watchPosition(onTrackPos, onTrackErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    }

    function stopTracking(keepUI) {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null; tracking = false; lastTick = null;
      stopSpeaking();
      keepAwake(false);
      if (!keepUI && dirBox.classList.contains('show')) updateDirections(false, true);
    }

    function onTrackPos(pos) {
      const lat = pos.coords.latitude, lng = pos.coords.longitude, acc = pos.coords.accuracy || 0;
      showMe(lat, lng, acc);
      const first = !lastTick, now = Date.now();
      if (!first && hav(lastTick, [lat, lng]) < 2 && now - lastTickTime < 4000) return;   // barely moved: skip the update
      lastTick = [lat, lng]; lastTickTime = now;
      myGap = setMyLocation(lat, lng);
      ensureMeOption();
      dirFrom.value = 'me';
      const dest = facilities.find(f => f.id === Number(dirTo.value));
      if (!dest) { stopTracking(true); return; }
      if (hav([lat, lng], [dest.lat, dest.lng]) <= ARRIVE_M) {
        stopTracking(true);
        speak('You have arrived at ' + dest.name);
        lastRoute = null; currentSteps = []; routeLayer.clearLayers();
        dirResult.innerHTML = `<div class="live-card"><div class="big">🏁</div><div><div class="t1">You have arrived at ${dest.name}!</div><div class="t2">Live tracking stopped.</div></div></div>`;
        return;
      }
      updateDirections(true, true);
      if (follow && myGap <= OFF_CAMPUS) followTo(lat, lng, first ? 18 : null);
    }

    function onTrackErr(err) {
      if (err.code === 1) {
        stopTracking(true);
        dirResult.innerHTML = '<p class="dir-warn">⚠ Location permission was denied. Allow location for this page in your browser, then try again.</p><p class="dir-hint">Note: location only works on https:// links or on localhost, not when the file is opened directly.</p>';
      } else if (!lastTick) {
        dirResult.innerHTML = '<p class="dir-warn">⚠ Still looking for your location. Make sure GPS/location is on (it works best outdoors).</p>';
      }
    }


    // ================= 3D FLY-THROUGH =================
    // Real 3D: a MapLibre GL scene with extruded OpenStreetMap buildings on top of the satellite map.
    // A glowing marker walks the route and the camera follows it, turning with the path.
    // If the phone/browser cannot do WebGL (or MapLibre fails to load), it falls back to the older
    // tilted-camera effect on the flat Leaflet map, so the button always does something.
    const flyLayer = L.layerGroup().addTo(map);
    let flyOn = false, flyPaused = false, flyDone = false, flyRaf = 0, flyT = 0, flyLast = 0, flyData = null;
    let flyTimer = 0, tiltTimer = 0, panelWasHidden = false, flyWalker = null, flyGlow = null, flyCore = null;
    let flyMode = 'tilt';                       // 'gl' = real 3D, 'tilt' = fallback
    let gl = null, glWalker = null, glMarkers = [], glBear = 0, glLoadTimer = 0, glFrameNo = 0;

    // Height (metres) of the coloured landmark block drawn at each place. These blocks make sure every
    // place is visible in 3D even where OpenStreetMap has no building drawn. Change the numbers freely.
    const GL_HEIGHT = { Academic: 26, Administration: 24, Library: 22, Hostel: 22, Temple: 20, Auditorium: 20, Placement: 18, Food: 14, Lab: 14, Entrance: 12, Utility: 0.4, Sports: 0.4 };
    const GL_BLOCK_HALF = 5;                    // half the block width in metres (5 = a 10 m x 10 m block)

    function accent2Color() { return getComputedStyle(document.body).getPropertyValue('--accent2').trim() || '#ff2bd6'; }
    function walkerIcon() {
      return L.divIcon({
        className: '', iconSize: [0, 0], iconAnchor: [0, 0],
        html: '<div class="walker"><div class="w-ring"></div><div class="w-shadow"></div><div class="w-dot"></div></div>'
      });
    }
    function setInteractions(on) {
      ['dragging', 'touchZoom', 'scrollWheelZoom', 'doubleClickZoom', 'boxZoom', 'keyboard'].forEach(h => { if (map[h]) map[h][on ? 'enable' : 'disable'](); });
    }
    function setTilt(on) {
      const wrap = document.getElementById('mapWrap');
      clearTimeout(tiltTimer);
      if (on) {
        wrap.classList.add('big');
        map.invalidateSize({ animate: false });
        void wrap.offsetWidth;                      // let the browser apply the bigger size first, so the tilt can animate
        wrap.classList.add('tilt');
      } else {
        wrap.classList.remove('tilt');
        tiltTimer = setTimeout(() => { wrap.classList.remove('big'); map.invalidateSize({ animate: false }); }, 950);
      }
    }
    function updateHud(p) {
      document.getElementById('flyFill').style.width = Math.round(p * 100) + '%';
    }

    // ---------- helpers for the real-3D scene ----------
    function glSupported() {
      try {
        if (!window.maplibregl) return false;
        const c = document.createElement('canvas');
        return !!(c.getContext('webgl2') || c.getContext('webgl'));
      } catch (e) { return false; }
    }
    const lngLat = p => [p[1], p[0]];           // route points are [lat, lng]; MapLibre wants [lng, lat]
    function lineFeature(coords) {
      if (coords.length === 1) coords = [coords[0], coords[0]];
      return { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } };
    }
    function bearingDeg(a, b) {
      const r = Math.PI / 180, dl = (b[1] - a[1]) * r;
      const y = Math.sin(dl) * Math.cos(b[0] * r);
      const x = Math.cos(a[0] * r) * Math.sin(b[0] * r) - Math.sin(a[0] * r) * Math.cos(b[0] * r) * Math.cos(dl);
      return (Math.atan2(y, x) / r + 360) % 360;
    }
    function posAtDist(s) {                     // point on the route after walking s metres
      const pts = flyData.pts, cum = flyData.cum;
      let lo = 0, hi = pts.length - 2;
      while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (cum[mid] <= s) lo = mid; else hi = mid - 1; }
      const seg = (cum[lo + 1] - cum[lo]) || 1, f = Math.min(1, Math.max(0, (s - cum[lo]) / seg));
      return [pts[lo][0] + (pts[lo + 1][0] - pts[lo][0]) * f, pts[lo][1] + (pts[lo + 1][1] - pts[lo][1]) * f];
    }
    function headingAt(s) {                     // which way the path points a little ahead of s
      const a = posAtDist(s), b = posAtDist(Math.min(flyData.total, s + 40));
      return hav(a, b) < 2 ? null : bearingDeg(a, b);
    }
    function glBlocks() {
      return {
        type: 'FeatureCollection',
        features: facilities.filter(f => !facilityCovered(f)).map(f => {
          const dLat = GL_BLOCK_HALF / 111320, dLng = GL_BLOCK_HALF / (111320 * Math.cos(f.lat * Math.PI / 180));
          return {
            type: 'Feature', properties: { color: TYPE[f.type].color, height: GL_HEIGHT[f.type] || 14 },
            geometry: { type: 'Polygon', coordinates: [[
              [f.lng - dLng, f.lat - dLat], [f.lng + dLng, f.lat - dLat], [f.lng + dLng, f.lat + dLat],
              [f.lng - dLng, f.lat + dLat], [f.lng - dLng, f.lat - dLat]
            ]] }
          };
        })
      };
    }
    function glStyle(theme, c2, routeCoords, beam) {
      const dark = theme === 'dark';
      const h = ['coalesce', ['get', 'render_height'], 6];
      return {
        version: 8,
        light: { anchor: 'map', position: [1.2, 210, 35], color: '#ffffff', intensity: dark ? 0.4 : 0.55 },
        sources: {
          sat: { type: 'raster', tiles: [ESRI_IMAGERY], tileSize: 256, maxzoom: 19, attribution: ATTR },
          osm: {
            type: 'vector', url: 'https://tiles.openfreemap.org/planet',
            attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
          },
          blocks: { type: 'geojson', data: glBlocks() },
          custom: { type: 'geojson', data: glCustom() },
          beam:   { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [beam] } } },
          path:   { type: 'geojson', data: lineFeature(routeCoords) },
          trail:  { type: 'geojson', data: lineFeature([routeCoords[0]]) }
        },
        layers: [
          { id: 'bg', type: 'background', paint: { 'background-color': dark ? '#0b0d1a' : '#e8eaf6' } },
          { id: 'sat', type: 'raster', source: 'sat', paint: dark
              ? { 'raster-hue-rotate': 180, 'raster-brightness-max': 0.65, 'raster-saturation': -0.1, 'raster-contrast': 0.2 }
              : { 'raster-brightness-min': 0.15, 'raster-saturation': -0.4, 'raster-contrast': -0.1 } },
          { id: 'buildings', type: 'fill-extrusion', source: 'osm', 'source-layer': 'building', minzoom: 14, layout: { visibility: bld.length ? 'none' : 'visible' },
            paint: {
              'fill-extrusion-color': dark
                ? ['interpolate', ['linear'], h, 0, '#4a54a8', 30, '#8a96ff']
                : ['interpolate', ['linear'], h, 0, '#b4b9f2', 30, '#ffffff'],
              'fill-extrusion-height': h,
              'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
              'fill-extrusion-opacity': 0.9
            } },
          { id: 'blocks', type: 'fill-extrusion', source: 'blocks',
            paint: {
              'fill-extrusion-color': ['get', 'color'],
              'fill-extrusion-height': ['get', 'height'],
              'fill-extrusion-base': 0,
              'fill-extrusion-opacity': 0.85
            } },
          { id: 'custom', type: 'fill-extrusion', source: 'custom',
            paint: { 'fill-extrusion-color': ['get', 'wall'], 'fill-extrusion-height': ['get', 'height'], 'fill-extrusion-base': 0, 'fill-extrusion-opacity': 0.96 } },
          { id: 'custom-edge', type: 'line', source: 'custom', layout: { 'line-join': 'round' },
            paint: { 'line-color': ['get', 'roof'], 'line-width': 2.5, 'line-opacity': 0.9, 'line-blur': 0.5 } },
          { id: 'custom-roof', type: 'fill-extrusion', source: 'custom',
            paint: { 'fill-extrusion-color': ['get', 'roof'], 'fill-extrusion-base': ['get', 'height'], 'fill-extrusion-height': ['+', ['get', 'height'], 0.8], 'fill-extrusion-opacity': 1 } },
          { id: 'beam', type: 'fill-extrusion', source: 'beam',
            paint: { 'fill-extrusion-color': c2, 'fill-extrusion-base': 0, 'fill-extrusion-height': 70, 'fill-extrusion-opacity': 0.4 } },
          { id: 'path', type: 'line', source: 'path', layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': c2, 'line-width': 4, 'line-opacity': 0.35 } },
          { id: 'trail-glow', type: 'line', source: 'trail', layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': c2, 'line-width': 16, 'line-opacity': 0.35, 'line-blur': 6 } },
          { id: 'trail-core', type: 'line', source: 'trail', layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': c2, 'line-width': 6, 'line-opacity': 1 } }
        ]
      };
    }
    function glPinEl(f, withLabel) {
      const el = document.createElement('div');
      el.className = 'gpin' + (withLabel ? ' big' : '');
      el.style.setProperty('--c', TYPE[f.type].color);
      const em = document.createElement('span'); em.textContent = TYPE[f.type].emoji; el.appendChild(em);
      if (withLabel) { const b = document.createElement('b'); b.textContent = f.name; el.appendChild(b); }
      return el;
    }
    function glTeardown() {
      clearTimeout(glLoadTimer);
      glMarkers.forEach(m => m.remove()); glMarkers = [];
      if (glWalker) { glWalker.remove(); glWalker = null; }
      if (gl) { try { gl.remove(); } catch (e) {} gl = null; }
      document.getElementById('map3d').classList.remove('show');
    }
    function glSetTrail(coords) {
      const src = gl && gl.getSource('trail');
      if (src) src.setData(lineFeature(coords));
    }

    function startGL() {
      const pts = flyData.pts, p0 = pts[0];
      const theme = document.body.dataset.theme === 'light' ? 'light' : 'dark';
      const a = dirFrom.value === 'me' ? null : Number(dirFrom.value), b = Number(dirTo.value);
      glBear = headingAt(0) ?? 0;
      glFrameNo = 0;
      document.getElementById('map3d').classList.add('show');
      gl = new maplibregl.Map({
        container: 'gl3d',
        style: glStyle(theme, accent2Color(), pts.map(lngLat), beamRing(pts[pts.length - 1])),
        center: lngLat(p0), zoom: flyData.glZoom - 0.7, pitch: 0, bearing: glBear,
        maxPitch: 80, maxZoom: 20, interactive: false, fadeDuration: 0,
        attributionControl: { compact: true }
      });
      gl.on('error', e => console.warn('3D map:', e && e.error && e.error.message));
      glMarkers = facilities.map(f => new maplibregl.Marker({ element: glPinEl(f, f.id === a || f.id === b), anchor: 'center' })
        .setLngLat([f.lng, f.lat]).addTo(gl));
      const wrap = document.createElement('div');
      wrap.innerHTML = '<div class="walker"><div class="w-ring"></div><div class="w-shadow"></div><div class="w-dot"></div></div>';
      glWalker = new maplibregl.Marker({ element: wrap, anchor: 'center' }).setLngLat(lngLat(p0)).addTo(gl);

      let started = false;
      const begin = () => {                      // tilt the camera in, then start walking
        if (started || !flyOn || flyMode !== 'gl') return;
        started = true; clearTimeout(glLoadTimer);
        gl.easeTo({ pitch: 62, zoom: flyData.glZoom, bearing: glBear, duration: 1000,
                    padding: { top: Math.round(window.innerHeight * 0.28), bottom: 0, left: 0, right: 0 } });
        flyTimer = setTimeout(() => { if (!flyOn) return; flyLast = performance.now(); flyRaf = requestAnimationFrame(flyFrame); }, 1100);
      };
      gl.once('load', begin);
      glLoadTimer = setTimeout(begin, 7000);     // slow network: start anyway
    }

    function startTilt() {
      const pts = flyData.pts;
      setInteractions(false);
      setTilt(true);
      flyLayer.clearLayers();
      const c2 = accent2Color();
      flyGlow = L.polyline([pts[0]], { color: c2, weight: 16, opacity: 0.35, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(flyLayer);
      flyCore = L.polyline([pts[0]], { color: c2, weight: 6, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(flyLayer);
      flyWalker = L.marker(pts[0], { icon: walkerIcon(), interactive: false, keyboard: false, zIndexOffset: 3000 }).addTo(flyLayer);
      map.setView(pts[0], flyData.zoom, { animate: false });
      flyTimer = setTimeout(() => { if (!flyOn) return; flyLast = performance.now(); flyRaf = requestAnimationFrame(flyFrame); }, 1100);   // after the tilt-in
    }

    function startFly() {
      if (!lastRoute || flyOn) return;
      const pts = pts_of(lastRoute);
      const cum = [0];
      for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + hav(pts[i - 1], pts[i]));
      const total = cum[cum.length - 1];
      if (pts.length < 2 || total < 5) return;
      flyData = { pts, cum, total, idx: 0, dur: Math.min(40, Math.max(7, total / 45)) * 1000,
                  zoom: total < 450 ? 19 : 18, glZoom: total < 450 ? 18.6 : 18 };
      flyOn = true; flyPaused = false; flyDone = false; flyT = 0;
      map.closePopup();
      const panel = document.getElementById('panel');
      panelWasHidden = panel.classList.contains('hidden');
      panel.classList.add('hidden');                // full-screen view while it plays
      document.getElementById('flyHud').classList.add('show');
      document.getElementById('flyPause').textContent = '⏸';
      document.getElementById('flyTxt').textContent = '🎬 3D preview';
      updateHud(0);
      clearTimeout(flyTimer);
      flyMode = glSupported() ? 'gl' : 'tilt';
      if (flyMode === 'gl') {
        try { startGL(); return; }
        catch (e) { console.warn('Real 3D failed, using the tilted view instead:', e); glTeardown(); flyMode = 'tilt'; }
      }
      startTilt();
    }

    function flyFrame(now) {
      if (!flyOn) return;
      const dt = now - flyLast; flyLast = now;
      if (!flyPaused && !flyDone) flyT = Math.min(1, flyT + dt / flyData.dur);
      const p = 0.5 * flyT + 0.5 * (0.5 - 0.5 * Math.cos(Math.PI * flyT));   // gentle start and stop
      const s = p * flyData.total, pts = flyData.pts, cum = flyData.cum;
      let i = flyData.idx;
      while (i < pts.length - 2 && cum[i + 1] < s) i++;
      flyData.idx = i;
      const segLen = (cum[i + 1] - cum[i]) || 1;
      const f = Math.min(1, Math.max(0, (s - cum[i]) / segLen));
      const pos = [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f];

      if (flyMode === 'gl') {
        if (!gl) return;
        glWalker.setLngLat(lngLat(pos));
        if ((glFrameNo++ & 1) === 0 || flyT >= 1) {                       // trail every 2nd frame is plenty
          const trail = pts.slice(0, i + 1).map(lngLat); trail.push(lngLat(pos));
          glSetTrail(trail);
        }
        const target = flyDone ? null : headingAt(s);                     // turn the camera smoothly with the path
        if (target !== null) {
          const d = ((target - glBear + 540) % 360) - 180;
          glBear = (glBear + d * (1 - Math.exp(-dt / 450)) + 360) % 360;
        }
        if (flyDone) glBear = (glBear + dt * 0.015) % 360;                // arrived: slow victory lap around the destination
        gl.jumpTo({ center: lngLat(pos), bearing: glBear });
      } else {
        flyWalker.setLatLng(pos);
        const trail = pts.slice(0, i + 1); trail.push(pos);
        flyGlow.setLatLngs(trail); flyCore.setLatLngs(trail);
        // camera: slide the map so the walker stays in the middle
        const off = map.latLngToContainerPoint(pos).subtract(map.getSize().divideBy(2));
        map.panBy(off, { animate: false });
      }

      updateHud(flyT);
      if (flyT >= 1) {
        flyDone = true;
        document.getElementById('flyPause').textContent = '↻';
        document.getElementById('flyTxt').textContent = '🏁 Arrived';
        if (flyMode !== 'gl') return;
      }
      flyRaf = requestAnimationFrame(flyFrame);
    }

    function flyToggle() {
      if (!flyOn) return;
      if (flyDone) {                                 // replay
        flyDone = false; flyPaused = false; flyT = 0; flyData.idx = 0;
        const a = flyData.pts[0];
        if (flyMode === 'gl' && gl) {
          glBear = headingAt(0) ?? glBear;
          glSetTrail([lngLat(a)]);
          glWalker.setLngLat(lngLat(a));
          gl.jumpTo({ center: lngLat(a), bearing: glBear });
        } else {
          map.setView(a, flyData.zoom, { animate: false });
          flyGlow.setLatLngs([a]); flyCore.setLatLngs([a]); flyWalker.setLatLng(a);
        }
        document.getElementById('flyTxt').textContent = '🎬 3D preview';
        flyLast = performance.now();
        cancelAnimationFrame(flyRaf);
        flyRaf = requestAnimationFrame(flyFrame);
      } else {
        flyPaused = !flyPaused;
        flyLast = performance.now();
      }
      document.getElementById('flyPause').textContent = flyDone ? '↻' : (flyPaused ? '▶' : '⏸');
    }

    function stopFly() {
      if (!flyOn) return;
      flyOn = false;
      cancelAnimationFrame(flyRaf); clearTimeout(flyTimer);
      document.getElementById('flyHud').classList.remove('show');
      if (flyMode === 'gl') {
        glTeardown();                                // the flat Leaflet map underneath was never moved
        if (!panelWasHidden) document.getElementById('panel').classList.remove('hidden');
        return;
      }
      flyLayer.clearLayers();
      setTilt(false);
      setInteractions(true);
      if (!panelWasHidden) document.getElementById('panel').classList.remove('hidden');
      setTimeout(() => {                             // back to the normal flat view of the whole route
        if (!flyOn && lastRoute) map.fitBounds(L.latLngBounds(pts_of(lastRoute)), { padding: [70, 70], maxZoom: 19 });
      }, 1000);
    }
    document.getElementById('flyPause').onclick = flyToggle;
    document.getElementById('flyClose').onclick = () => stopFly();
    document.addEventListener('keydown', e => { if (e.key === 'Escape') stopFly(); });

    // ================= NEAREST TO ME =================
    // To add a new button (for example restrooms), add a place with a new type in TYPE and facilities, then add a line here.
    const NEAR_OPTIONS = [
      { label: 'Canteen', emoji: '🍔', type: 'Food' },
      { label: 'Hostel',  emoji: '🏠', type: 'Hostel' },
      { label: 'Library', emoji: '📚', type: 'Library' },
      { label: 'Parking', emoji: '🅿️', type: 'Utility' },
      { label: 'Gate',    emoji: '🚪', type: 'Entrance' },
      { label: 'Temple',  emoji: '🛕', type: 'Temple' },
      { label: 'Auditorium', emoji: '🎭', type: 'Auditorium' }
    ];

    function nearestTo(opt) {
      locateMe(() => {
        openDirBox();
        if (myGap > OFF_CAMPUS) {
          dirResult.innerHTML = `<p class="dir-warn">⚠ You are about ${Math.round(myGap)} m from the campus paths, so I cannot find the nearest ${opt.label.toLowerCase()} by walking. Try again when you are on campus.</p>`;
          return;
        }
        let best = null;
        facilities.filter(f => f.type === opt.type).forEach(f => {
          const r = shortestPath('me', f.id);
          if (r && (!best || r.dist < best.r.dist)) best = { f, r };
        });
        if (!best) { dirResult.innerHTML = `<p class="dir-warn">⚠ No walking route found to a ${opt.label.toLowerCase()}.</p>`; return; }
        dirFrom.value = 'me';
        dirTo.value = String(best.f.id);
        updateDirections();
        dirResult.insertAdjacentHTML('afterbegin', `<p class="dir-hint">⭐ Nearest ${opt.label.toLowerCase()}: <b>${best.f.name}</b></p>`);
      });
    }

    function buildNearRow() {
      const row = document.getElementById('nearRow');
      NEAR_OPTIONS.forEach(o => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.textContent = o.emoji + ' ' + o.label;
        b.onclick = () => nearestTo(o);
        row.appendChild(b);
      });
    }

    // ================= SHARE / QR + DIRECT LINKS =================
    // Links look like:  <your link>?place=17     opens that place
    //                   <your link>?from=1&to=17 opens walking directions between two places
    //                   <your link>?to=17&go=1   starts live directions to that place from wherever the person is standing
    const shareModal = document.getElementById('shareModal');
    const qrBox = document.getElementById('qrBox');
    let shareUrl = PUBLIC_URL, shareFile = 'campus-navigator-qr.png';

    function linkTo(params) {
      const base = PUBLIC_URL.split(/[?#]/)[0];
      return base + '?' + new URLSearchParams(params).toString();
    }
    function slug(t) { return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

    function openShare(opts) {
      opts = opts || {};
      shareUrl = opts.url || PUBLIC_URL;
      shareFile = opts.file || 'campus-navigator-qr.png';
      document.getElementById('shareTitle').textContent = opts.title || '🔗 Share Campus Navigator';
      document.getElementById('shareDesc').textContent = opts.desc || 'Scan this QR code with a phone camera to open the app.';
      document.getElementById('shareUrl').textContent = shareUrl;
      document.getElementById('nativeShareBtn').style.display = navigator.share ? '' : 'none';
      shareModal.classList.add('show');
      qrBox.innerHTML = '';
      try {
        if (!window.QRCode) throw new Error('no QR library');
        new QRCode(qrBox, { text: shareUrl, width: 220, height: 220, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
        document.getElementById('dlQrBtn').style.display = '';
      } catch (e) {
        // backup: online QR image (cannot be downloaded from here)
        qrBox.innerHTML = '<img width="220" height="220" alt="QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&data=' + encodeURIComponent(shareUrl) + '">';
        document.getElementById('dlQrBtn').style.display = 'none';
      }
    }
    function closeShare() { shareModal.classList.remove('show'); }

    function sharePlace(id) {
      const f = facilities.find(x => x.id === id);
      if (!f) return;
      openShare({ url: linkTo({ place: id }), title: '🔗 ' + f.name, desc: 'Scan to open ' + f.name + ' on the campus map.', file: 'qr-' + slug(f.name) + '.png' });
    }
    function shareRoute() {
      const a = dirFrom.value, b = Number(dirTo.value);
      if (!b) return;
      const to = placeName(b);
      if (a && a !== 'me') {
        const from = placeName(Number(a));
        openShare({ url: linkTo({ from: a, to: b }), title: '🔗 Share route', desc: 'Scan to open walking directions from ' + from + ' to ' + to + '.', file: 'qr-route-' + slug(from) + '-to-' + slug(to) + '.png' });
      } else {
        openShare({ url: linkTo({ to: b, go: 1 }), title: '🧭 Navigate to ' + to, desc: 'Scan to get live walking directions to ' + to + ' from wherever you are standing.', file: 'qr-navigate-' + slug(to) + '.png' });
      }
    }

    document.getElementById('shareBtn').onclick = () => openShare();
    document.getElementById('shareClose').onclick = closeShare;
    shareModal.addEventListener('click', e => { if (e.target === shareModal) closeShare(); });

    document.getElementById('copyLinkBtn').onclick = e => {
      const btn = e.currentTarget;
      const done = () => { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy link', 1400); };
      const fallback = () => {
        const t = document.createElement('textarea'); t.value = shareUrl; document.body.appendChild(t);
        t.select(); try { document.execCommand('copy'); } catch (err) {} t.remove(); done();
      };
      if (navigator.clipboard) navigator.clipboard.writeText(shareUrl).then(done).catch(fallback); else fallback();
    };
    document.getElementById('nativeShareBtn').onclick = () => {
      if (navigator.share) navigator.share({ title: 'Campus Navigator', text: 'Find your way around APS College of Engineering', url: shareUrl }).catch(() => {});
    };
    document.getElementById('dlQrBtn').onclick = () => {
      const src = qrBox.querySelector('canvas');
      if (!src) return;
      const m = 24, c = document.createElement('canvas');   // add a white border so phones scan it easily
      c.width = src.width + m * 2; c.height = src.height + m * 2;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(src, m, m);
      const a = document.createElement('a');
      a.href = c.toDataURL('image/png'); a.download = shareFile;
      document.body.appendChild(a); a.click(); a.remove();
    };

    // open the right thing when someone arrives through a direct link / QR code
    function openFromLink() {
      let q;
      try { q = new URLSearchParams(location.search); } catch (e) { return; }
      const find = v => facilities.find(f => String(f.id) === String(v));
      const to = find(q.get('to')), from = find(q.get('from')), place = find(q.get('place'));
      if (to) {
        openDirBox();
        dirTo.value = String(to.id);
        if (from && from.id !== to.id) {
          dirFrom.value = String(from.id);
          updateDirections();
        } else {
          setActive(to.id);
          map.flyTo([to.lat, to.lng], 18, { duration: 1 });
          if (q.get('go') === '1') startTracking();
          else dirResult.innerHTML = '<p class="dir-hint">📍 Tap the 📍 button to start from where you are, or choose a starting point (A).</p>';
        }
      } else if (place) {
        selectFacility(place);
      }
    }

    // ================= START =================
    // Admin mode (shows the Path tool): open the app with ?admin=1 once. Use ?admin=0 to switch it off again.
    try {
      const qa = new URLSearchParams(location.search).get('admin');
      if (qa === '1') localStorage.setItem('campusAdmin', '1');
      if (qa === '0') localStorage.removeItem('campusAdmin');
      if (localStorage.getItem('campusAdmin') === '1') document.body.classList.add('admin');
    } catch (e) {}
    document.getElementById('themeBtn').onclick = () => setTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');
    buildChips();
    buildNearRow();
    applyFilter();
    // Automatic theme: bright from 6 AM to 6 PM, dark at night. (The button still switches it by hand until the next change.)
    const autoTheme = () => { const h = new Date().getHours(); return (h >= 6 && h < 18) ? 'light' : 'dark'; };
    let autoPeriod = autoTheme();
    setTheme(autoPeriod);
    setInterval(() => { const p = autoTheme(); if (p !== autoPeriod) { autoPeriod = p; setTheme(p); } }, 60000);
    fitAll();
    updateLabels();
    openFromLink();
  </script>
</body>
</html>
