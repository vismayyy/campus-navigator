<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Navigator - APS College of Engineering</title>

  <!-- Shows any error on the screen so problems are easy to see -->
  <script>
    window.addEventListener('error', function (e) {
      var b = document.getElementById('errbox');
      if (!b) { b = document.createElement('div'); b.id = 'errbox'; (document.body || document.documentElement).appendChild(b); }
      b.textContent = 'Error: ' + e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '');
    });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Backup source: only used if the first one fails to load -->
  <script>
    window.L || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"><\/script>');
  </script>


  <!-- MapLibre GL: used only for the real-3D route preview (the normal map stays Leaflet) -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    window.maplibregl || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"><\/script>');
  </script>

  <!-- QR code library (used by the Share button) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ---------- THEMES ---------- */
    body[data-theme="dark"] {
      --glass: rgba(10, 12, 30, 0.72); --solid: #0d1029; --card: rgba(255,255,255,0.06);
      --text: #e8ecff; --muted: #8b93c7; --accent: #00f0ff; --accent2: #ff2bd6;
      --border: rgba(0, 240, 255, 0.25); --glow: 0 0 18px rgba(0, 240, 255, 0.35); --fog: #0b0d1a;
    }
    body[data-theme="light"] {
      --glass: rgba(255, 255, 255, 0.80); --solid: #ffffff; --card: rgba(99,102,241,0.08);
      --text: #1f2340; --muted: #6b7094; --accent: #6366f1; --accent2: #ec4899;
      --border: rgba(99, 102, 241, 0.25); --glow: 0 6px 20px rgba(99, 102, 241, 0.25); --fog: #e8eaf6;
    }

    /* ---------- MAP TILE LOOKS (colour filters on the street map) ---------- */
    .tiles-dark   { filter: hue-rotate(180deg) saturate(.9) brightness(.62) contrast(1.2); }
    .tiles-light  { filter: brightness(1.25) saturate(.55) contrast(.85); }
    body[data-theme="dark"]  #map { background: #0b0d1a; }
    body[data-theme="light"] #map { background: #e8eaf6; }

    /* ---------- BASE ---------- */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: 'Poppins', system-ui, sans-serif; color: var(--text); }
    #mapWrap { position: fixed; inset: 0; z-index: 0; overflow: hidden; perspective: 1000px; background: var(--fog, #111); }
    #map { position: absolute; inset: 0; z-index: 0; background: #111; transform-origin: 50% 50%; transition: transform .9s ease; }
    /* 3D view: the map gets bigger than the screen (so no empty edges show), then tips back like a floor */
    #mapWrap.big #map { inset: -50%; }
    #mapWrap.tilt #map { transform: translateY(6vh) rotateX(50deg); }
    #fog { position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .9s ease;
           background: linear-gradient(to bottom, var(--fog) 0%, var(--fog) 10%, transparent 42%); }
    #mapWrap.tilt #fog { opacity: 1; }
    /* stand the pins and labels back up so they do not look squashed in 3D */
    #mapWrap.tilt .pin, #mapWrap.tilt .lbl, #mapWrap.tilt .w-dot { scale: 1 1.55; }
    #map.tool-on, #map.tool-on .leaflet-interactive { cursor: crosshair; }

    #errbox {
      position: fixed; z-index: 5000; left: 50%; bottom: 16px; transform: translateX(-50%);
      background: #b91c1c; color: #fff; padding: 10px 16px; border-radius: 10px;
      font: 600 13px 'Poppins', sans-serif; max-width: 90vw;
    }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      box-shadow: var(--glow), 0 10px 30px rgba(0,0,0,0.25);
      border-radius: 18px;
    }

    /* ---------- SIDE PANEL ---------- */
    #panel {
      position: fixed; z-index: 1200; top: 14px; left: 14px; bottom: 14px; width: 330px;
      display: flex; flex-direction: column; padding: 16px; overflow: hidden;
      animation: slideIn .6s ease both; transition: transform .35s ease, opacity .35s ease;
    }
    #panel.hidden { transform: translateX(-120%); opacity: 0; pointer-events: none; }
    @keyframes slideIn { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex: none; }
    .logo {
      width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: var(--glow);
    }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .3px; }
    .brand p { margin: 0; font-size: 11px; color: var(--muted); }

    #search {
      flex: none; width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font: 500 14px 'Poppins', sans-serif; outline: none;
    }
    #search::placeholder { color: var(--muted); }
    #search:focus { border-color: var(--accent); box-shadow: var(--glow); }

    #chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; flex: none; }
    .chip {
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      padding: 4px 10px; border-radius: 999px; font: 500 11.5px 'Poppins', sans-serif; cursor: pointer; transition: .2s;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; }

    #list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 4px; }
    #list::-webkit-scrollbar { width: 6px; }
    #list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

    .card {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px;
      background: var(--card); border: 1px solid transparent; border-radius: 14px; cursor: pointer; transition: .2s;
    }
    .card:hover { border-color: var(--accent); transform: translateX(4px); }
    .card.active { border-color: var(--accent); box-shadow: var(--glow); }
    .card .ico {
      width: 38px; height: 38px; flex: none; display: grid; place-items: center; font-size: 19px;
      border-radius: 12px; background: color-mix(in srgb, var(--c) 28%, transparent); border: 1px solid var(--c);
    }
    .card .name { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
    .card .type { font-size: 11px; color: var(--muted); }

    .panel-foot { flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .panel-foot > span:last-child { display: flex; gap: 6px; }
    .btn { white-space: nowrap; }
    .sh-txt { display: none; }
    .btn {
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      padding: 7px 12px; border-radius: 10px; font: 500 12px 'Poppins', sans-serif; cursor: pointer; transition: .2s;
    }
    .btn:hover { border-color: var(--accent); box-shadow: var(--glow); }

    /* ---------- TOP-RIGHT CONTROLS ---------- */
    #controls {
      position: fixed; z-index: 1200; top: 14px; right: 14px; display: flex; gap: 10px; align-items: center;
      padding: 8px 12px; animation: slideIn .8s ease both;
    }
    .divider { width: 1px; height: 22px; background: var(--border); }
    #toggle { display: none; }
    /* Path tool is for the admin only: hidden unless the link has ?admin=1 */
    #toolBtn, #toolDivider { display: none; }
    body.admin #toolBtn, body.admin #toolDivider { display: inline-block; }

    /* ---------- PATH TOOL BOX ---------- */
    #coordbox {
      position: fixed; z-index: 1200; top: 74px; right: 14px; width: 270px; padding: 14px; display: none;
    }
    #coordbox.show { display: block; }
    #coordbox h3 { margin: 0 0 4px; font-size: 14px; }
    #coordbox small { color: var(--muted); font-size: 11px; display: block; margin-bottom: 8px; }
    #coordText {
      width: 100%; height: 150px; resize: none; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font: 12px/1.5 monospace; padding: 8px; outline: none;
    }
    #coordbox .row { display: flex; gap: 6px; margin-top: 8px; }

    /* ---------- MARKERS ---------- */
    .pin {
      --pin: 36px;
      position: absolute; left: 50%; top: 50%;
      width: var(--pin); height: var(--pin);
      margin: calc(var(--pin) / -2) 0 0 calc(var(--pin) / -2);
      border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--pin) * 0.5);
      background: var(--solid); border: 2.5px solid var(--c);
      box-shadow: 0 0 14px var(--c), 0 4px 10px rgba(0,0,0,.4);
      animation: drop .5s ease backwards;
      transition: width .2s, height .2s, margin .2s, font-size .2s, transform .2s, scale .9s ease;
    }
    .pin:hover { transform: scale(1.2); }
    .pin.active { --pin: 36px; transform: scale(1.25); }
    /* smaller pins when zoomed out, so they do not overlap */
    .zoom-18 .pin { --pin: 28px; }
    .zoom-17 .pin { --pin: 20px; border-width: 2px; box-shadow: 0 0 8px var(--c); }
    .zoom-far .pin { --pin: 13px; border-width: 2px; box-shadow: 0 0 6px var(--c); }
    .zoom-far .pin span { display: none; }
    .zoom-far .pin.active span { display: inline; }
    .zoom-17 .pin.active, .zoom-18 .pin.active, .zoom-far .pin.active { --pin: 36px; border-width: 2.5px; box-shadow: 0 0 14px var(--c), 0 4px 10px rgba(0,0,0,.4); }
    .pin.dc-hide { display: none; }   /* hidden when too close to a more important pin */
    .pin.active::after {
      content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--c);
      animation: pulse 1.4s ease-out infinite;
    }
    @keyframes drop { from { transform: translateY(-20px) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes pulse { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }

    .lbl {
      opacity: 0 !important; transition: opacity .25s, scale .9s ease; background: var(--solid); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; font: 600 11px 'Poppins', sans-serif; padding: 2px 8px; box-shadow: none;
    }
    .labels .lbl { opacity: 1 !important; }
    .leaflet-tooltip-bottom.lbl::before { display: none; }

    .ptnum {
      background: var(--accent); color: #000; border: none; font: 700 10px 'Poppins', sans-serif;
      padding: 1px 6px; border-radius: 8px; box-shadow: none;
    }
    .leaflet-tooltip-top.ptnum::before { border-top-color: var(--accent); }

    /* ---------- POPUP ---------- */
    .glass-pop .leaflet-popup-content-wrapper {
      background: var(--solid); color: var(--text); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--glow);
    }
    .glass-pop .leaflet-popup-tip { background: var(--solid); }
    .glass-pop .leaflet-popup-content { margin: 14px 16px; font-family: 'Poppins', sans-serif; }
    .pop-head { display: flex; align-items: center; gap: 12px; }
    .pop-emoji { font-size: 28px; }
    .pop-name { font-weight: 700; font-size: 14px; line-height: 1.2; }
    .badge {
      display: inline-block; margin-top: 4px; padding: 2px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 600;
      color: #fff; background: var(--c);
    }
    .pop-info { margin: 10px 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .pop-photo { display: block; width: 100%; height: 110px; object-fit: cover; border-radius: 10px; margin: 0 0 10px; background: var(--card); }
    .pop-time { margin: -4px 0 10px; font-size: 12px; font-weight: 600; color: var(--accent); }
    .dir {
      width: 100%; padding: 8px; border: none; border-radius: 10px; font: 600 12px 'Poppins', sans-serif; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); cursor: pointer; transition: .2s;
    }
    .dir:hover { box-shadow: var(--glow); transform: translateY(-1px); }
    .pop-btns { display: flex; gap: 6px; }
    .pop-btns .dir { flex: 1; width: auto; }
    .pop-btns .dir.alt { flex: none; padding: 8px 10px; background: var(--card); color: var(--text); border: 1px solid var(--border); }

    .leaflet-control-zoom a { background: var(--solid) !important; color: var(--text) !important; border-color: var(--border) !important; }
    .leaflet-control-attribution { background: var(--glass) !important; color: var(--muted) !important; }
    .leaflet-control-attribution a { color: var(--accent) !important; }

    /* ---------- DIRECTIONS BOX ---------- */
    #dirbox { flex: none; max-height: 60%; overflow-y: auto; display: none; margin: 12px 0 0; padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); }
    #dirbox.show { display: block; }
    .dir-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13.5px; margin-bottom: 10px; }
    .dir-x { border: none; background: transparent; color: var(--muted); font-size: 15px; cursor: pointer; }
    .dir-x:hover { color: var(--accent); }
    .dir-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .dir-dot {
      flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
      font: 700 11px 'Poppins', sans-serif; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2));
    }
    #dirbox select {
      flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--solid); color: var(--text); font: 500 12.5px 'Poppins', sans-serif; outline: none;
    }
    #dirbox select:focus { border-color: var(--accent); }
    .dir-swap {
      flex: none; width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--solid); color: var(--text); cursor: pointer; font-size: 14px;
    }
    .dir-swap:hover { border-color: var(--accent); }
    .dir-hint { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    .dir-stats { display: flex; gap: 16px; margin-top: 6px; font-weight: 600; font-size: 14px; }
    .dir-warn { margin: 8px 0 0; font-size: 11.5px; color: #fbbf24; line-height: 1.4; }

    /* ---------- STEPS + LIVE TRACKING ---------- */
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; }
    .dir-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .dir-actions .btn { flex: 1 1 auto; padding: 8px 8px; }
    .live-card {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 28%, transparent), color-mix(in srgb, var(--accent2) 22%, transparent));
      border: 1px solid var(--accent);
    }
    .live-card .big { flex: none; font-size: 28px; line-height: 1; }
    .live-card .t1 { font-weight: 700; font-size: 13.5px; line-height: 1.3; }
    .live-card .t2 { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .steps-sum { cursor: pointer; font-weight: 600; font-size: 12.5px; margin-top: 12px; }
    .steps { list-style: none; margin: 6px 0 0; padding: 0; }
    .step { display: flex; align-items: flex-start; gap: 8px; padding: 7px 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
    .step:hover { border-color: var(--border); }
    .step.now { background: var(--card); border-color: var(--accent); }
    .step .si { flex: none; width: 26px; text-align: center; font-size: 17px; line-height: 1.3; }
    .step .st { font-size: 12.5px; font-weight: 500; line-height: 1.35; }
    .step .sd { font-size: 11px; color: var(--muted); }


    .gpin { transition: none; }
    /* ---------- REAL 3D SCENE (MapLibre) ---------- */
    #map3d { position: fixed; inset: 0; z-index: 900; display: none; background: var(--fog, #111); }
    #map3d.show { display: block; animation: glin .6s ease; }
    #gl3d { position: absolute; inset: 0; }
    #glFog { position: absolute; inset: 0; z-index: 2; pointer-events: none;
             background: linear-gradient(to bottom, var(--fog) 0%, transparent 22%); }
    @keyframes glin { from { opacity: 0; } to { opacity: 1; } }
    #map3d .maplibregl-canvas { outline: none; }
    #map3d .maplibregl-ctrl-bottom-right, #map3d .maplibregl-ctrl-bottom-left { bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
    .gpin {
      --c: #fff; position: relative; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px;
      background: var(--solid); border: 2px solid var(--c); box-shadow: 0 0 10px var(--c), 0 3px 8px rgba(0,0,0,.4); pointer-events: none;
    }
    .gpin.big { width: 34px; height: 34px; font-size: 17px; border-width: 2.5px; z-index: 2; }
    .gpin b {
      position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 5px; white-space: nowrap;
      font: 600 11px 'Poppins', sans-serif; color: var(--text); background: var(--solid);
      border: 1px solid var(--border); border-radius: 8px; padding: 2px 8px;
    }

    /* ---------- 3D FLY-THROUGH ---------- */
    #flyHud {
      position: fixed; z-index: 1300; left: 50%; transform: translateX(-50%);
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      display: none; align-items: center; gap: 10px; padding: 8px 12px; width: min(440px, calc(100vw - 24px));
    }
    #flyHud.show { display: flex; }
    #flyHud .btn { padding: 6px 10px; }
    .fly-bar { flex: 1; height: 6px; border-radius: 6px; background: var(--card); border: 1px solid var(--border); overflow: hidden; }
    #flyFill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    #flyTxt { font: 600 11.5px 'Poppins', sans-serif; color: var(--text); white-space: nowrap; }
    .walker { position: relative; width: 0; height: 0; }
    .walker .w-ring {
      position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%;
      border: 2px solid var(--accent2); animation: wring 1.5s ease-out infinite;
    }
    .walker .w-shadow {
      position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%;
      background: rgba(0,0,0,.5); filter: blur(3px);
    }
    .walker .w-dot {
      position: absolute; left: -13px; top: -40px; width: 26px; height: 26px; border-radius: 50%; transform-origin: 50% 100%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--accent2) 55%, var(--accent) 100%);
      box-shadow: 0 0 18px var(--accent2), 0 6px 10px rgba(0,0,0,.35); animation: wbob 0.9s ease-in-out infinite alternate;
    }
    @keyframes wring { from { transform: scale(.35); opacity: .95; } to { transform: scale(1.5); opacity: 0; } }
    @keyframes wbob { from { transform: translateY(0); } to { transform: translateY(-7px); } }

    /* ---------- NEAREST TO ME ---------- */
    #nearRow { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 0; }
    .near-lbl { flex: none; font: 600 11px 'Poppins', sans-serif; color: var(--muted); white-space: nowrap; }
    #nearRow .chip { white-space: nowrap; }

    /* ---------- SHARE / QR ---------- */
    #shareModal {
      position: fixed; inset: 0; z-index: 3000; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55); padding: 16px;
    }
    #shareModal.show { display: flex; }
    #shareCard { width: min(340px, 100%); padding: 18px; text-align: center; background: var(--solid); max-height: 92vh; overflow-y: auto; }
    #shareCard h3 { margin: 0 0 4px; font-size: 16px; }
    #shareCard p { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
    #qrBox { display: inline-block; background: #fff; padding: 12px; border-radius: 14px; line-height: 0; min-width: 64px; min-height: 64px; }
    #qrBox img, #qrBox canvas { max-width: 100%; height: auto; }
    #shareUrl {
      margin: 12px 0 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--card);
      font-size: 11.5px; word-break: break-all; user-select: all;
    }
    #shareCard .row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

    /* ---------- MOBILE ---------- */
    @media (max-width: 700px) {
      #panel {
        top: auto; left: 10px; right: 10px; width: auto; padding: 12px;
        bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        height: 50vh; height: 50dvh;
      }
      /* when Directions is open: hide the long list so the bottom buttons never get cut off.
         The directions box scrolls by itself if it is too tall; the buttons stay fixed at the bottom. */
      #panel.dir-open { height: auto; max-height: 70vh; max-height: 70dvh; }
      #panel.dir-open #list, #panel.dir-open .brand, #panel.dir-open #search,
      #panel.dir-open #chips, #panel.dir-open #nearRow { display: none; }
      #panel.dir-open #dirbox { margin-top: 0; flex: 0 1 auto; min-height: 0; max-height: none; }
      .brand { margin-bottom: 8px; gap: 10px; }
      .brand .logo { width: 34px; height: 34px; font-size: 17px; border-radius: 11px; }
      .brand h1 { font-size: 15px; }
      .brand p { display: none; }
      #chips { flex-wrap: nowrap; overflow-x: auto; margin: 8px 0; padding-bottom: 4px; }

      #nearRow { flex-wrap: nowrap; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; }

      /* bottom buttons: always visible, share the full width, easy to tap */
      .panel-foot { margin-top: 8px; }
      #count { display: none; }

      #controls { top: 10px; right: 10px; padding: 6px 10px; }
      #toggle { display: inline-block; }
      #coordbox { top: 62px; right: 10px; width: 240px; }
      .leaflet-control-zoom { display: none; }   /* phones use pinch-to-zoom; the buttons were hidden behind the panel */
    }
  </style>
</head>

  <script>
    // ================= DATA =================
    const TYPE = {
      "Entrance":       { emoji: "🚪", color: "#22d3ee" },
      "Utility":        { emoji: "🅿️", color: "#94a3b8" },
      "Academic":       { emoji: "🎓", color: "#818cf8" },
      "Administration": { emoji: "🏛️", color: "#f59e0b" },
      "Placement":      { emoji: "💼", color: "#34d399" },
      "Lab":            { emoji: "⚙️", color: "#fb7185" },
      "Library":        { emoji: "📚", color: "#a78bfa" },
      "Food":           { emoji: "🍔", color: "#fb923c" },
      "Hostel":         { emoji: "🏠", color: "#f472b6" },
      "Sports":         { emoji: "⚽", color: "#4ade80" },
      "Temple":         { emoji: "🛕", color: "#fbbf24" },
      "Auditorium":     { emoji: "🎭", color: "#2dd4bf" }
    };

    // Order of importance when pins are too close together (earlier = stays visible when zoomed out)
    const PRIORITY = ["Entrance", "Academic", "Library", "Food", "Hostel", "Administration", "Sports", "Temple", "Auditorium", "Placement", "Lab", "Utility"];

    // The link people open (used for the QR code). Change this if your link changes.
    const PUBLIC_URL = "https://vismayyy.github.io/campus-navigator/";

    // Each place can have:  info: "short description"   and (optional)   timings: "9:00 AM - 5:00 PM"
    // Timings show on the info card only when you add them. Example:
    //   { id: 10, name: "APS Library", ..., info: "Books and reading hall", timings: "9:00 AM - 5:00 PM" },
    //
    // PHOTOS: make a folder called  photos  next to index.html and put one picture per place in it, named after the place:
    //   photos/aps-library.jpg   photos/canteen.jpg   photos/main-gate.jpg   (lowercase, spaces become -, .jpg)
    // The photo appears on the info card automatically. If a picture is missing, the card simply shows no photo.
    // To use a different file name, add  photo: "photos/my-picture.jpg"  to that place.
    // TIP: keep each photo small (under 200 KB, about 800 px wide) so the page opens fast on a phone.
    const facilities = [
      { id: 1,  name: "Main Gate",                     type: "Entrance",       lat: 12.78283,           lng: 77.49911,          info: "Campus entrance" },
      { id: 2,  name: "Parking",                       type: "Utility",        lat: 12.78347,           lng: 77.49807,          info: "Vehicle parking area" },
      { id: 3,  name: "CS & Civil Engineering Block",  type: "Academic",       lat: 12.783545054827869, lng: 77.49869610558333, info: "A.P.S Computer Science & Civil Engineering Block" },
      { id: 4,  name: "College of Engineering",        type: "Academic",       lat: 12.783684906752127, lng: 77.49654612477204, info: "Main engineering college building" },
      { id: 5,  name: "CSE/ISE Block (First Years)",   type: "Academic",       lat: 12.783598420679828, lng: 77.49635871637008, info: "CSE and ISE block for first year students" },
      { id: 6,  name: "APS Polytechnic Main Gate",     type: "Entrance",       lat: 12.786275867045564, lng: 77.50228133361014, info: "Main gate of APS Polytechnic" },
      { id: 7,  name: "Administrative Block",          type: "Administration", lat: 12.78290,           lng: 77.49757,          info: "College administrative offices", timings: "9:00 AM - 4:30 PM" },
      { id: 8,  name: "Placement and Training Center", type: "Placement",      lat: 12.78378,           lng: 77.49693,          info: "Placement and training activities", timings: "9:00 AM - 5:00 PM" },
      { id: 9,  name: "Foundry and Forging Lab",       type: "Lab",            lat: 12.78393,           lng: 77.49859,          info: "Mechanical department lab" },
      { id: 10, name: "APS Library",                   type: "Library",        lat: 12.782808732056443, lng: 77.4970212662975,  info: "Books and reading hall", timings: "9:00 AM - 5:00 PM" },
      { id: 11, name: "Canteen",                       type: "Food",           lat: 12.78269,           lng: 77.49715,          info: "Food and refreshments", timings: "8:00 AM - 5:00 PM" },
      { id: 12, name: "Boys Hostel",                   type: "Hostel",         lat: 12.78899439799923,  lng: 77.49774557731553, info: "Boys hostel" },
      { id: 13, name: "Girls Hostel",                  type: "Hostel",         lat: 12.78307,           lng: 77.49661,          info: "Girls hostel" },
      { id: 14, name: "Polytechnic Playground",        type: "Sports",         lat: 12.78707972413123,  lng: 77.49901800683597, info: "Playground and sports area" },
      { id: 15, name: "Shri Ananthapadmanabha Swamy Temple", type: "Temple",   lat: 12.783529186107438, lng: 77.4972574215545,  info: "Temple inside the campus" },
      { id: 16, name: "College of Engineering Sports",   type: "Sports",         lat: 12.782838384289903, lng: 77.49825265040775, info: "Sports area of the College of Engineering" },
      { id: 17, name: "APS PU College",                 type: "Academic",       lat: 12.7840262,           lng: 77.4965326, info: "APS Pre-University College" },
      { id: 18, name: "APS Polytechnic",                type: "Academic",       lat: 12.78767650902096,  lng: 77.4983474808576,  info: "APS Polytechnic college" },
      { id: 19, name: "Open Auditorium",               type: "Auditorium",     lat: 12.7830698,         lng: 77.4972636,        info: "Open-air auditorium for events and gatherings" },
      { id: 20, name: "APS Cricket Stadium",            type: "Sports",         lat: 12.7861194,         lng: 77.4981718,        info: "Cricket ground" }
    ];

    // Building outlines for the 3D preview (estimated around each place pin: [lat, lng] corners, floors = height).
    // To fix one, change its pts or floors. Add "roof": "#ffcc00" to colour a roof.
    const BUILDINGS = [
      {"id": "b3", "name": "CS & Civil Engineering Block", "type": "Academic", "floors": 3, "pts": [[12.783717, 77.498826], [12.783756, 77.498665], [12.783373, 77.498566], [12.783334, 77.498727]]},
      {"id": "b4", "name": "College of Engineering", "type": "Academic", "floors": 4, "pts": [[12.783593, 77.496666], [12.783697, 77.496698], [12.783777, 77.496426], [12.783673, 77.496394]]},
      {"id": "b5", "name": "CSE/ISE Block (First Years)", "type": "Academic", "floors": 3, "pts": [[12.783535, 77.496434], [12.783611, 77.496458], [12.783662, 77.496283], [12.783586, 77.49626]]},
      {"id": "b7", "name": "Administrative Block", "type": "Administration", "floors": 2, "pts": [[12.783007, 77.497682], [12.78305, 77.497542], [12.782793, 77.497458], [12.78275, 77.497598]]},
      {"id": "b8", "name": "Placement and Training Center", "type": "Placement", "floors": 2, "pts": [[12.783862, 77.497016], [12.783891, 77.496891], [12.783698, 77.496844], [12.783669, 77.496969]]},
      {"id": "b9", "name": "Foundry and Forging Lab", "type": "Lab", "floors": 1, "pts": [[12.783843, 77.498693], [12.783966, 77.498721], [12.784017, 77.498487], [12.783894, 77.498459]]},
      {"id": "b10", "name": "APS Library", "type": "Library", "floors": 2, "pts": [[12.78272, 77.4971], [12.782823, 77.497141], [12.782898, 77.496942], [12.782794, 77.496901]]},
      {"id": "b11", "name": "Canteen", "type": "Food", "floors": 1, "pts": [[12.782626, 77.497201], [12.782704, 77.497232], [12.782754, 77.497099], [12.782676, 77.497068]]},
      {"id": "b12", "name": "Boys Hostel", "type": "Hostel", "floors": 4, "pts": [[12.788814, 77.497911], [12.78892, 77.497981], [12.789174, 77.49758], [12.789069, 77.49751]]},
      {"id": "b13", "name": "Girls Hostel", "type": "Hostel", "floors": 4, "pts": [[12.782965, 77.496794], [12.783088, 77.496822], [12.783175, 77.496426], [12.783052, 77.496398]]},
      {"id": "b15", "name": "Shri Ananthapadmanabha Swamy Temple", "type": "Temple", "floors": 1, "pts": [[12.78345, 77.497298], [12.783569, 77.497339], [12.783609, 77.497217], [12.78349, 77.497176]]},
      {"id": "b17", "name": "APS PU College", "type": "Academic", "floors": 3, "pts": [[12.784179, 77.496654], [12.784219, 77.496512], [12.783873, 77.496411], [12.783834, 77.496553]]},
      {"id": "b18", "name": "APS Polytechnic", "type": "Academic", "floors": 3, "pts": [[12.787525, 77.498548], [12.787678, 77.498601], [12.787828, 77.498147], [12.787675, 77.498094]]},
      {"id": "b19", "name": "Open Auditorium", "type": "Auditorium", "floors": 2, "pts": [[12.783141, 77.497393], [12.783215, 77.497266], [12.782998, 77.497134], [12.782925, 77.497261]]}
    ];

    // ================= MAP + THEMES =================
    const map = L.map('map', { zoomControl: false, maxZoom: 19 }).setView([12.783545, 77.498696], 17);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // All themes use free Esri tiles (no API key needed)
    const ESRI_STREET  = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}';
    const ESRI_IMAGERY = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
    const ATTR = 'Tiles &copy; Esri';

    const TILES = {
      dark:  L.tileLayer(ESRI_IMAGERY, { maxZoom: 19, attribution: ATTR, className: 'tiles-dark' }),
      light: L.tileLayer(ESRI_IMAGERY, { maxZoom: 19, attribution: ATTR, className: 'tiles-light' })
    };
    let currentTile = null;

    function setTheme(name) {
      document.body.dataset.theme = name;
      if (currentTile) map.removeLayer(currentTile);
      currentTile = TILES[name].addTo(map);
      document.getElementById('themeBtn').textContent = name === 'dark' ? '☀️ Bright' : '🌙 Dark';
      try { localStorage.setItem('campusTheme', name); } catch (e) {}
      redrawPoints();
      redrawRoute();
    }

    // ================= MARKERS =================
    const markers = {};
    let selectedId = null;

    function pinIcon(f) {
      const t = TYPE[f.type];
      return L.divIcon({
        className: '',
        html: `<div class="pin" style="--c:${t.color}"><span>${t.emoji}</span></div>`,
        iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -22]
      });
    }

    // Photos: uses f.photo if you set one, otherwise photos/<place-name>.jpg (see the PHOTOS note above the facilities list).
    // The app first checks quietly whether the picture exists; the card only shows a photo when it does.
    const photoOk = {};
    function photoFor(f) { return f.photo || ('photos/' + slug(f.name) + '.jpg'); }

    function popupHTML(f) {
      const t = TYPE[f.type];
      return `
        ${photoOk[f.id] ? `<img class="pop-photo" src="${photoFor(f)}" alt="${f.name}">` : ''}
        <div class="pop-head">
          <div class="pop-emoji">${t.emoji}</div>
          <div><div class="pop-name">${f.name}</div><span class="badge" style="--c:${t.color}">${f.type}</span></div>
        </div>
        <p class="pop-info">${f.info}</p>
        ${f.timings ? `<p class="pop-time">🕒 ${f.timings}</p>` : ''}
        <div class="pop-btns">
          <button class="dir" onclick="startDirections(${f.id})">🧭 Directions</button>
          <button class="dir alt" onclick="sharePlace(${f.id})" title="Share this place (QR code)">🔗 Share</button>
        </div>`;
    }

    function setActive(id) {
      selectedId = id;
      Object.values(markers).forEach(m => { const el = m.getElement(); if (el) el.firstChild.classList.remove('active'); });
      if (id && markers[id] && markers[id].getElement()) markers[id].getElement().firstChild.classList.add('active');
      Object.entries(markers).forEach(([k, m]) => m.setZIndexOffset(Number(k) === id ? 1000 : 0));
      document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', Number(c.dataset.id) === id));
      declutter();
    }

    // When zoomed out, hide pins that would sit on top of a more important pin (the selected pin is always shown)
    function declutter() {
      const z = map.getZoom();
      const minPx = z >= 19 ? 0 : z === 18 ? 30 : z === 17 ? 26 : 22;
      const shown = facilities.filter(f => map.hasLayer(markers[f.id])).sort((a, b) => {
        if (a.id === selectedId) return -1;
        if (b.id === selectedId) return 1;
        return PRIORITY.indexOf(a.type) - PRIORITY.indexOf(b.type);
      });
      const kept = [];
      shown.forEach(f => {
        const p = map.latLngToContainerPoint([f.lat, f.lng]);
        const clash = minPx > 0 && kept.some(q => Math.hypot(p.x - q.x, p.y - q.y) < minPx);
        if (!clash) kept.push(p);
        const el = markers[f.id].getElement();
        if (el && el.firstChild) el.firstChild.classList.toggle('dc-hide', clash);
      });
    }

    facilities.forEach(f => {
      const m = L.marker([f.lat, f.lng], { icon: pinIcon(f) }).addTo(map);
      m.bindPopup(popupHTML(f), { className: 'glass-pop', closeButton: false, minWidth: 200, maxWidth: 260 });
      m.bindTooltip(f.name, { permanent: true, direction: 'bottom', offset: [0, 18], className: 'lbl', opacity: 1 });
      m.on('click', () => setActive(f.id));
      m.on('popupclose', () => { if (selectedId === f.id) setActive(null); });
      markers[f.id] = m;
    });

    // check which photos exist; for each one found, refresh that place's info card once
    facilities.forEach(f => {
      const im = new Image();
      im.onload = () => { photoOk[f.id] = true; markers[f.id].setPopupContent(popupHTML(f)); };
      im.src = photoFor(f);
    });

    // show name labels only when zoomed in
    function updateLabels() {
      const z = map.getZoom(), c = map.getContainer();
      c.classList.toggle('labels', z >= 19);
      c.classList.toggle('zoom-18', z === 18);
      c.classList.toggle('zoom-17', z === 17);
      c.classList.toggle('zoom-far', z <= 16);
      declutter();
    }
    map.on('zoomend', updateLabels);

    function fitAll() {
      const pts = facilities.filter(f => map.hasLayer(markers[f.id])).map(f => [f.lat, f.lng]);
      if (pts.length) map.fitBounds(pts, { padding: [60, 60], maxZoom: 18 });
    }

    // ================= SIDEBAR =================
    const listDiv = document.getElementById('list');
    const chipsDiv = document.getElementById('chips');
    const searchBox = document.getElementById('search');
    let activeType = 'All';

    function selectFacility(f) {
      map.flyTo([f.lat, f.lng], 19, { duration: 1.2 });
      markers[f.id].openPopup();
      setActive(f.id);
      if (window.innerWidth <= 700) document.getElementById('panel').classList.add('hidden');
    }

    function applyFilter() {
      const text = searchBox.value.toLowerCase().trim();
      const items = facilities.filter(f =>
        (activeType === 'All' || f.type === activeType) &&
        (f.name.toLowerCase().includes(text) || f.type.toLowerCase().includes(text))
      );

      // list
      listDiv.innerHTML = '';
      items.forEach(f => {
        const t = TYPE[f.type];
        const div = document.createElement('div');
        div.className = 'card' + (f.id === selectedId ? ' active' : '');
        div.dataset.id = f.id;
        div.innerHTML = `
          <div class="ico" style="--c:${t.color}">${t.emoji}</div>
          <div><div class="name">${f.name}</div><div class="type">${f.type}</div></div>`;
        div.onclick = () => selectFacility(f);
        listDiv.appendChild(div);
      });

      // markers
      const ids = new Set(items.map(f => f.id));
      facilities.forEach(f => {
        if (ids.has(f.id)) { if (!map.hasLayer(markers[f.id])) markers[f.id].addTo(map); }
        else map.removeLayer(markers[f.id]);
      });

      document.getElementById('count').textContent = items.length + ' places';
      declutter();
    }

    function buildChips() {
      const types = ['All', ...new Set(facilities.map(f => f.type))];
      types.forEach(t => {
        const b = document.createElement('button');
        b.className = 'chip' + (t === 'All' ? ' active' : '');
        b.textContent = (t === 'All' ? '✨ ' : TYPE[t].emoji + ' ') + t;
        b.onclick = () => {
          activeType = t;
          document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          b.classList.add('active');
          applyFilter();
        };
        chipsDiv.appendChild(b);
      });
    }

    searchBox.addEventListener('input', applyFilter);
    document.getElementById('fitBtn').onclick = fitAll;
    document.getElementById('toggle').onclick = () => document.getElementById('panel').classList.toggle('hidden');

    // ================= PATH TOOL =================
    let toolOn = false;
    const points = [];
    const pointLayer = L.layerGroup().addTo(map);
    const coordText = document.getElementById('coordText');

    function accentColor() { return getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#00f0ff'; }

    function redrawPoints() {
      pointLayer.clearLayers();
      const c = accentColor();
      if (points.length > 1) L.polyline(points, { color: c, weight: 4, dashArray: '8 8' }).addTo(pointLayer);
      points.forEach((p, i) => {
        L.circleMarker(p, { radius: 6, color: '#fff', weight: 2, fillColor: c, fillOpacity: 1 })
          .bindTooltip(String(i + 1), { permanent: true, direction: 'top', className: 'ptnum', offset: [0, -4] })
          .addTo(pointLayer);
      });
      coordText.value = points.map((p, i) => `${i + 1} - ${p[0].toFixed(6)}, ${p[1].toFixed(6)}`).join('\n');
      coordText.scrollTop = coordText.scrollHeight;
    }

    map.on('click', e => {
      if (!toolOn) return;
      points.push([e.latlng.lat, e.latlng.lng]);
      redrawPoints();
    });

    document.getElementById('toolBtn').onclick = e => {
      toolOn = !toolOn;
      e.target.textContent = '📍 Path tool: ' + (toolOn ? 'ON' : 'OFF');
      document.getElementById('coordbox').classList.toggle('show', toolOn);
      document.getElementById('map').classList.toggle('tool-on', toolOn);
    };
    document.getElementById('undoBtn').onclick = () => { points.pop(); redrawPoints(); };
    document.getElementById('clearBtn').onclick = () => { points.length = 0; redrawPoints(); };
    document.getElementById('copyBtn').onclick = e => {
      coordText.select();
      const done = () => { e.target.textContent = 'Copied!'; setTimeout(() => e.target.textContent = 'Copy', 1200); };
      if (navigator.clipboard) navigator.clipboard.writeText(coordText.value).then(done).catch(() => { document.execCommand('copy'); done(); });
      else { document.execCommand('copy'); done(); }
    };

    // ================= 3D BUILDING HELPERS =================
    const FLOOR_H = 3.4;                        // metres per floor in the 3D view
    const bld = BUILDINGS;
    function pointInPoly(pt, poly) {
      let c = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const a = poly[i], b = poly[j];
        if ((a[0] > pt[0]) !== (b[0] > pt[0]) && pt[1] < (b[1] - a[1]) * (pt[0] - a[0]) / (b[0] - a[0]) + a[1]) c = !c;
      }
      return c;
    }
    function facilityCovered(f) {               // a building outline already marks this place, so no generic block is needed
      const p = [f.lat, f.lng];
      return bld.some(b => pointInPoly(p, b.pts) || b.pts.some(q => hav(p, q) < 25));
    }
    function mixHex(a, b, t) {
      const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), x = p(a), y = p(b);
      return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
    }
    function glCustom() {                       // the building outlines, as 3D shapes
      const dark = document.body.dataset.theme !== 'light';
      return { type: 'FeatureCollection', features: bld.map(b => {
        const col = (TYPE[b.type] || {}).color || '#818cf8', ring = b.pts.map(p => [p[1], p[0]]); ring.push(ring[0]);
        return { type: 'Feature', properties: { wall: mixHex(col, dark ? '#aab4ff' : '#ffffff', 0.62), roof: b.roof || col, height: Math.max(1, b.floors || 1) * FLOOR_H },
                 geometry: { type: 'Polygon', coordinates: [ring] } };
      }) };
    }
    function beamRing(p) {                      // a tall light beam on the destination
      const d = 2.5, a = d / 111320, o = d / (111320 * Math.cos(p[0] * Math.PI / 180));
      return [[p[1] - o, p[0] - a], [p[1] + o, p[0] - a], [p[1] + o, p[0] + a], [p[1] - o, p[0] + a], [p[1] - o, p[0] - a]];
    }

    // ================= WALKING ROUTES (from your Path tool points) =================
    // Each line is one walking route: from a place, through the points you clicked, to another place.
    // To add a new route later, just add one more line here.
    const ROUTES = [
      { from: 1,  to: 2,  pts: [[12.782849, 77.499042], [12.783265, 77.497926], [12.783477, 77.498017]] },
      { from: 2,  to: 3,  pts: [[12.783271, 77.497921], [12.783022, 77.498664], [12.783289, 77.498733]] },
      { from: 3,  to: 7,  pts: [[12.783284, 77.498733], [12.783012, 77.498666], [12.783250, 77.497918], [12.782870, 77.497789]] },
      { from: 7,  to: 15, pts: [[12.782865, 77.497787], [12.783250, 77.497913], [12.783469, 77.497247]] },
      { from: 15, to: 11, pts: [[12.783467, 77.497242], [12.783407, 77.497449], [12.782787, 77.497226]] },
      { from: 11, to: 10, pts: [[12.782784, 77.497231], [12.782857, 77.497036]] },
      { from: 10, to: 13, pts: [[12.782865, 77.497038], [12.783093, 77.497089], [12.783163, 77.496789]] },
      { from: 13, to: 8,  pts: [[12.783163, 77.496786], [12.783095, 77.497097], [12.783467, 77.497167], [12.783571, 77.496885], [12.783637, 77.496904]] },
      { from: 8,  to: 4,  pts: [[12.783637, 77.496907], [12.783571, 77.496891], [12.783650, 77.496609]] },
      { from: 5,  to: 9,  pts: [[12.783655, 77.496606], [12.783299, 77.497821], [12.783943, 77.497977], [12.783822, 77.498530]] },
      { from: 9,  to: 12, pts: [[12.783815, 77.498524], [12.783956, 77.497977], [12.784709, 77.498116], [12.785776, 77.496931], [12.787267, 77.497494], [12.787126, 77.498347], [12.787586, 77.498551], [12.788151, 77.498723], [12.788774, 77.497741]] },
      { from: 12, to: 6,  pts: [[12.788769, 77.497736], [12.788157, 77.498733], [12.787602, 77.498562], [12.786315, 77.502220]] },
      { from: 15, to: 17, pts: [[12.783428, 77.497344], [12.783452, 77.497873], [12.784033, 77.497964], [12.784338, 77.496631], [12.784082, 77.496556]] },
      { from: 17, to: 16, pts: [[12.784082, 77.496556], [12.784338, 77.496631], [12.784033, 77.497964], [12.783452, 77.497873], [12.783098, 77.498342], [12.782972, 77.498310]] },
      { from: 16, to: 18, pts: [[12.782978, 77.498310], [12.783103, 77.498342], [12.783318, 77.497805], [12.784735, 77.498127], [12.785808, 77.496931], [12.787330, 77.497602], [12.787184, 77.498229], [12.787524, 77.498358]] },
      { from: 6,  to: 18, pts: [[12.786336, 77.502129], [12.787634, 77.498460]] },
      { from: 18, to: 14, pts: [[12.787634, 77.498444], [12.787450, 77.499002], [12.787314, 77.498943]] },
      { from: 15, to: 19, pts: [[12.783393, 77.497240], [12.783356, 77.497408], [12.783167, 77.497293]] },
      { from: 2,  to: 20, pts: [[12.783501, 77.497903], [12.784768, 77.498084], [12.785512, 77.497302]] },
      { from: 6,  to: 20, pts: [[12.786307, 77.502179], [12.787544, 77.498568], [12.787094, 77.498353], [12.787338, 77.497594], [12.785807, 77.496908], [12.785512, 77.497261], [12.785622, 77.497293]] }
    ];

    const WALK_M_PER_MIN = 80;   // walking speed used for the time estimate
    const JOIN_DIST = 13;        // route points of different routes closer than this (metres) count as one junction
    const OFF_CAMPUS = 500;      // if your location is farther than this (metres) from every path, you are not on campus
    const FAR_DIST = 30;         // a place with no route drawn is joined to the nearest path point; farther than this = dotted line

    function hav(a, b) {
      const R = 6371000, rad = Math.PI / 180;
      const dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    // ---------- build the walking graph ----------
    const G = { nodes: [], adj: [] };
    const facNode = {};          // facility id -> node number
    const noRoutePlaces = new Set();

    function addNode(lat, lng, fid) { G.nodes.push({ lat, lng, fid }); G.adj.push([]); return G.nodes.length - 1; }
    function addEdge(a, b, approx) {
      const w = hav([G.nodes[a].lat, G.nodes[a].lng], [G.nodes[b].lat, G.nodes[b].lng]);
      G.adj[a].push({ to: b, w, approx: !!approx });
      G.adj[b].push({ to: a, w, approx: !!approx });
    }

    (function buildGraph() {
      facilities.forEach(f => { facNode[f.id] = addNode(f.lat, f.lng, f.id); });
      const routeNodes = [];
      ROUTES.forEach((r, ri) => {
        let prev = facNode[r.from];
        r.pts.forEach(p => {
          const n = addNode(p[0], p[1], null);
          routeNodes.push({ n, ri });
          addEdge(prev, n, false);
          prev = n;
        });
        addEdge(prev, facNode[r.to], false);
      });
      // junctions: points of different routes that are (almost) the same spot
      for (let i = 0; i < routeNodes.length; i++) {
        for (let j = i + 1; j < routeNodes.length; j++) {
          if (routeNodes[i].ri === routeNodes[j].ri) continue;
          const a = G.nodes[routeNodes[i].n], b = G.nodes[routeNodes[j].n];
          if (hav([a.lat, a.lng], [b.lat, b.lng]) <= JOIN_DIST) addEdge(routeNodes[i].n, routeNodes[j].n, false);
        }
      }
      // places that have no route drawn yet: join to the nearest path point
      facilities.forEach(f => {
        const n = facNode[f.id];
        if (G.adj[n].length > 0) return;
        let best = null, bestD = Infinity;
        routeNodes.forEach(rn => {
          const d = hav([f.lat, f.lng], [G.nodes[rn.n].lat, G.nodes[rn.n].lng]);
          if (d < bestD) { bestD = d; best = rn.n; }
        });
        if (best !== null) {
          const approx = bestD > FAR_DIST;
          addEdge(n, best, approx);
          if (approx) noRoutePlaces.add(f.id);
        }
      });
    })();

    // ---------- "my location" point (joined to the nearest path point) ----------
    let meNode = -1;
    function setMyLocation(lat, lng) {
      if (meNode === -1) {
        meNode = addNode(lat, lng, null);
      } else {
        G.adj[meNode].forEach(e => { G.adj[e.to] = G.adj[e.to].filter(x => x.to !== meNode); });
        G.adj[meNode] = [];
        G.nodes[meNode].lat = lat; G.nodes[meNode].lng = lng;
      }
      let best = -1, bestD = Infinity;
      G.nodes.forEach((nd, i) => {
        if (i === meNode) return;
        const d = hav([lat, lng], [nd.lat, nd.lng]);
        if (d < bestD) { bestD = d; best = i; }
      });
      addEdge(meNode, best, bestD > FAR_DIST);
      return bestD;   // how far you are from the nearest path point, in metres
    }

    // ---------- shortest path (Dijkstra) ----------
    function shortestPath(fromId, toId) {
      const n = G.nodes.length;
      const dist = new Array(n).fill(Infinity), prev = new Array(n).fill(-1);
      const prevApprox = new Array(n).fill(false), done = new Array(n).fill(false);
      const s = fromId === 'me' ? meNode : facNode[fromId], t = facNode[toId];
      dist[s] = 0;
      for (;;) {
        let u = -1;
        for (let i = 0; i < n; i++) if (!done[i] && dist[i] < Infinity && (u === -1 || dist[i] < dist[u])) u = i;
        if (u === -1 || u === t) break;
        done[u] = true;
        G.adj[u].forEach(e => {
          if (dist[u] + e.w < dist[e.to]) { dist[e.to] = dist[u] + e.w; prev[e.to] = u; prevApprox[e.to] = e.approx; }
        });
      }
      if (dist[t] === Infinity) return null;
      const nodes = [], approx = [];
      for (let v = t; v !== -1; v = prev[v]) { nodes.unshift(v); approx.unshift(prevApprox[v]); }
      return { nodes, approx, dist: dist[t] };
    }

    // ================= DIRECTIONS =================
    const dirBox = document.getElementById('dirbox');
    const dirFrom = document.getElementById('dirFrom');
    const dirTo = document.getElementById('dirTo');
    const dirResult = document.getElementById('dirResult');
    const routeLayer = L.layerGroup().addTo(map);
    let lastRoute = null;

    function buildDirSelects() {
      [dirFrom, dirTo].forEach((sel, i) => {
        sel.innerHTML = `<option value="">${i === 0 ? 'Choose starting point...' : 'Choose destination...'}</option>` +
          facilities.map(f => `<option value="${f.id}">${TYPE[f.type].emoji} ${f.name}</option>`).join('');
      });
    }
    buildDirSelects();

    function drawRoute() {
      routeLayer.clearLayers();
      if (!lastRoute) return;
      const c = accentColor();
      const pts = lastRoute.nodes.map(i => [G.nodes[i].lat, G.nodes[i].lng]);
      const flags = lastRoute.approx;
      L.polyline(pts, { color: '#ffffff', weight: 10, opacity: 0.85, lineCap: 'round', lineJoin: 'round' }).addTo(routeLayer);
      let run = [pts[0]], runApprox = flags[1];
      const flush = () => {
        L.polyline(run, runApprox
          ? { color: c, weight: 5, dashArray: '2 10', lineCap: 'round' }
          : { color: c, weight: 5, lineCap: 'round', lineJoin: 'round' }).addTo(routeLayer);
      };
      for (let k = 1; k < pts.length; k++) {
        if (flags[k] !== runApprox) { flush(); run = [pts[k - 1]]; runApprox = flags[k]; }
        run.push(pts[k]);
      }
      flush();
    }

    // >>> steps
    // ---------- turn-by-turn steps ----------
    const MIN_SEG = 6;      // path points closer than this (metres) count as one point
    const TURN_MIN = 40;    // direction changes smaller than this (degrees) count as "keep going straight"
    const ARRIVE_M = 20;    // live tracking: you have arrived when this close (metres) to the destination
    let currentSteps = [], tracking = false, watchId = null, follow = true, stepsOpen = true;
    let lastTick = null, lastTickTime = 0, wakeLock = null;

    function bearing(a, b) {
      const rad = Math.PI / 180, dL = (b[1] - a[1]) * rad;
      const y = Math.sin(dL) * Math.cos(b[0] * rad);
      const x = Math.cos(a[0] * rad) * Math.sin(b[0] * rad) - Math.sin(a[0] * rad) * Math.cos(b[0] * rad) * Math.cos(dL);
      return (Math.atan2(y, x) / rad + 360) % 360;
    }
    function compass(b) { return ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'][Math.round(b / 45) % 8]; }
    function fmtDist(m) {
      const r = m >= 30 ? Math.round(m / 5) * 5 : Math.max(1, Math.round(m));
      return r >= 1000 ? (r / 1000).toFixed(2) + ' km' : r + ' m';
    }
    function placeName(id) { const f = facilities.find(x => x.id === id); return f ? f.name : ''; }
    function nearbyPlace(p, skip) {
      let best = null, bd = 25;
      facilities.forEach(f => {
        if (skip.includes(f.id)) return;
        const d = hav([p.lat, p.lng], [f.lat, f.lng]);
        if (d < bd) { bd = d; best = f; }
      });
      return best;
    }
    function turnInfo(diff) {
      const a = Math.abs(diff), side = diff > 0 ? 'right' : 'left';
      if (a >= 155) return { icon: '↩️', text: 'Make a U-turn' };
      if (a >= 125) return { icon: diff > 0 ? '↘️' : '↙️', text: 'Take a sharp ' + side };
      if (a >= 60)  return { icon: diff > 0 ? '➡️' : '⬅️', text: 'Turn ' + side };
      return { icon: diff > 0 ? '↗️' : '↖️', text: 'Bear ' + side };
    }

    // turns a route (list of graph nodes) into a list of steps: start, turns / landmarks, arrive
    function buildSteps(r, fromKey, toId) {
      const P = [];
      r.nodes.forEach((ni, k) => {
        const nd = G.nodes[ni];
        const p = { lat: nd.lat, lng: nd.lng, fid: nd.fid };
        const isLast = k === r.nodes.length - 1;
        if (P.length) {
          const last = P[P.length - 1];
          if (!(p.fid || isLast) && hav([last.lat, last.lng], [p.lat, p.lng]) < MIN_SEG) return;   // tiny wiggle: skip it
          if (p.fid || isLast) {
            while (P.length > 1 && !P[P.length - 1].fid && hav([P[P.length - 1].lat, P[P.length - 1].lng], [p.lat, p.lng]) < MIN_SEG) P.pop();
          }
        }
        P.push(p);
      });
      // remove small zigzags (where two hand-drawn routes meet and the line briefly doubles back)
      for (let again = true; again;) {
        again = false;
        for (let i = 1; i < P.length - 1; i++) {
          if (P[i].fid) continue;
          const A = [P[i - 1].lat, P[i - 1].lng], B = [P[i].lat, P[i].lng], C = [P[i + 1].lat, P[i + 1].lng];
          const back = Math.abs(((bearing(B, C) - bearing(A, B) + 540) % 360) - 180) >= 150;
          if (back && Math.min(hav(A, B), hav(B, C)) < 15) { P.splice(i, 1); again = true; break; }
        }
      }
      const destName = placeName(toId);
      if (P.length < 2) return [{ icon: '🏁', text: 'Arrive at ' + destName, at: P[0], cum: 0, dist: 0 }];

      const seg = [], cum = [0];
      for (let i = 1; i < P.length; i++) {
        const a = [P[i - 1].lat, P[i - 1].lng], b = [P[i].lat, P[i].lng];
        seg.push({ b: bearing(a, b) });
        cum.push(cum[i - 1] + hav(a, b));
      }
      const skip = [toId]; if (fromKey !== 'me') skip.push(fromKey);
      const steps = [];
      steps.push({
        icon: '🚶', at: P[0], cum: 0,
        text: fromKey === 'me' ? 'Head ' + compass(seg[0].b) : 'Start at ' + placeName(fromKey) + ' and head ' + compass(seg[0].b)
      });
      let ref = seg[0].b;
      for (let i = 1; i < P.length - 1; i++) {
        const nb = seg[i].b;
        const diff = ((nb - ref + 540) % 360) - 180;          // -180..180, positive = right
        const here = P[i];
        const near = here.fid ? { name: placeName(here.fid), at: true } : (nearbyPlace(here, skip) ? { name: nearbyPlace(here, skip).name, at: false } : null);
        if (Math.abs(diff) >= TURN_MIN) {
          const m = turnInfo(diff);
          steps.push({ icon: m.icon, at: here, cum: cum[i], text: m.text + (near ? (near.at ? ' at ' : ' near ') + near.name : '') });
          ref = nb;
        } else if (here.fid) {
          steps.push({ icon: '📍', at: here, cum: cum[i], text: 'Pass ' + placeName(here.fid) });
        }
      }
      steps.push({ icon: '🏁', at: P[P.length - 1], cum: cum[P.length - 1], text: 'Arrive at ' + destName });
      steps.forEach((st, i) => { st.dist = i < steps.length - 1 ? steps[i + 1].cum - st.cum : 0; });
      return steps;
    }

    function stepsHTML(steps, nowIdx) {
      return '<ol class="steps">' + steps.map((s, i) =>
        `<li class="step${i === nowIdx ? ' now' : ''}" onclick="focusStep(${i})"><span class="si">${s.icon}</span><div><div class="st">${s.text}</div>${s.dist ? `<div class="sd">Walk ${fmtDist(s.dist)}</div>` : ''}</div></li>`
      ).join('') + '</ol>';
    }
    function focusStep(i) {
      const s = currentSteps[i];
      if (!s) return;
      setFollow(false);
      map.flyTo([s.at.lat, s.at.lng], 19, { duration: 0.8 });
      if (window.innerWidth <= 700) document.getElementById('panel').classList.add('hidden');
    }
    // <<< steps

    function updateDirections(live, noFit) {
      if (flyOn) stopFly();
      const keepScroll = dirBox.scrollTop;
      lastRoute = null;
      currentSteps = [];
      routeLayer.clearLayers();
      const a = dirFrom.value === 'me' ? 'me' : Number(dirFrom.value), b = Number(dirTo.value);
      if (!a || !b) { dirResult.innerHTML = '<p class="dir-hint">Choose a starting point and a destination.</p>'; return; }
      if (a === b) { dirResult.innerHTML = '<p class="dir-hint">Please choose two different places.</p>'; return; }
      if (a === 'me' && myGap > OFF_CAMPUS) {
        dirResult.innerHTML = `<p class="dir-warn">⚠ Your location is about ${Math.round(myGap)} m from the campus paths, so walking directions from here are not possible. Please choose a starting place instead.</p>`;
        return;
      }
      const r = shortestPath(a, b);
      if (!r) { dirResult.innerHTML = '<p class="dir-hint">Sorry, no walking route found between these places.</p>'; return; }
      lastRoute = r;
      drawRoute();
      currentSteps = buildSteps(r, a, b);
      const meters = Math.round(r.dist);
      const mins = Math.max(1, Math.round(r.dist / WALK_M_PER_MIN));
      const dist = meters >= 1000 ? (meters / 1000).toFixed(2) + ' km' : meters + ' m';

      let html = '';
      if (live && currentSteps.length > 1) {
        const nx = currentSteps[1];
        html += `<div class="live-card"><div class="big">${nx.icon}</div><div><div class="t1">In ${fmtDist(currentSteps[0].dist)}: ${nx.text}</div><div class="t2">📡 Live · ${dist} left · ~${mins} min</div></div></div>`;
        html += `<div class="dir-actions"><button class="btn" id="followBtn" onclick="recenter()">${follow ? '🎯 Following you' : '🎯 Recenter'}</button>${canSpeak ? `<button class="btn" id="voiceBtn" onclick="toggleVoice()">${voiceOn ? '🔊 Voice: ON' : '🔇 Voice: OFF'}</button>` : ''}<button class="btn" onclick="stopTracking()">⏹ Stop</button></div>`;
        voiceGuide(currentSteps);
      } else {
        html += `<div class="dir-stats"><span>🚶 ${dist}</span><span>⏱ ~${mins} min</span></div>`;
        html += `<div class="dir-actions"><button class="btn primary" onclick="startTracking()">📡 Start live tracking</button><button class="btn" onclick="startFly()">🎬 3D preview</button><button class="btn" onclick="shareRoute()">🔗 Share route</button></div>`;
      }
      const missing = [a, b].filter(id => noRoutePlaces.has(id)).map(id => facilities.find(f => f.id === id).name);
      if (missing.length) {
        html += `<p class="dir-warn">⚠ The dotted part is a straight line, because the walking path to ${missing.join(' and ')} is not drawn yet.</p>`;
      }
      if (a === 'me' && myGap > FAR_DIST) {
        html += `<p class="dir-warn">⚠ The dotted part joins your location to the nearest campus path (${Math.round(myGap)} m away).</p>`;
      }
      html += `<details id="stepsDet" ${stepsOpen ? 'open' : ''} ontoggle="stepsOpen = this.open"><summary class="steps-sum">🧭 Step-by-step (${currentSteps.length} steps)</summary>${stepsHTML(currentSteps, live ? 0 : -1)}</details>`;
      dirResult.innerHTML = html;
      dirBox.scrollTop = keepScroll;
      if (!live) {
        setActive(b);
        map.closePopup();
        if (!noFit) map.fitBounds(L.latLngBounds(pts_of(r)), { padding: [70, 70], maxZoom: 19 });
      }
    }
    function pts_of(r) { return r.nodes.map(i => [G.nodes[i].lat, G.nodes[i].lng]); }

    function openDirBox() {
      dirBox.classList.add('show');
      document.getElementById('panel').classList.remove('hidden');
      document.getElementById('panel').classList.add('dir-open');
    }
    function closeDirBox() {
      stopFly();
      stopTracking(true);
      dirBox.classList.remove('show');
      document.getElementById('panel').classList.remove('dir-open');
      lastRoute = null;
      routeLayer.clearLayers();
    }
    function startDirections(toId) {
      openDirBox();
      dirTo.value = String(toId);
      if (dirFrom.value === String(toId)) dirFrom.value = '';
      updateDirections(tracking);
    }
    function redrawRoute() { drawRoute(); }

    // ---------- use my location ----------
    const meLayer = L.layerGroup().addTo(map);
    let myGap = 0, meOptionAdded = false, meDot = null, meCircle = null;

    // blue dot + accuracy circle (moved, not re-created, so live tracking stays smooth)
    function showMe(lat, lng, acc) {
      const rad = Math.min(acc || 0, 150);
      if (!meDot) {
        meCircle = L.circle([lat, lng], { radius: rad, color: '#3b82f6', weight: 1, fillColor: '#3b82f6', fillOpacity: 0.15 }).addTo(meLayer);
        meDot = L.circleMarker([lat, lng], { radius: 8, color: '#ffffff', weight: 3, fillColor: '#3b82f6', fillOpacity: 1 })
          .bindTooltip('You are here', { direction: 'top' }).addTo(meLayer);
      } else {
        meCircle.setLatLng([lat, lng]); meCircle.setRadius(rad); meDot.setLatLng([lat, lng]);
      }
    }
    function ensureMeOption() {
      if (meOptionAdded) return;
      const o = document.createElement('option');
      o.value = 'me'; o.textContent = '📍 My location';
      dirFrom.add(o, 1);
      meOptionAdded = true;
    }

    function locateMe(onDone) {
      openDirBox();
      if (!navigator.geolocation) {
        dirResult.innerHTML = '<p class="dir-warn">⚠ Your browser does not support location.</p>';
        return;
      }
      dirResult.innerHTML = '<p class="dir-hint">📡 Finding your location...</p>';
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude, acc = pos.coords.accuracy || 0;
        showMe(lat, lng, acc);
        myGap = setMyLocation(lat, lng);
        ensureMeOption();
        dirFrom.value = 'me';
        if (typeof onDone === 'function') { onDone(); return; }
        if (myGap > OFF_CAMPUS) { updateDirections(); return; }
        if (!dirTo.value) {
          dirResult.innerHTML = '<p class="dir-hint">📍 Got your location. Now choose a destination (B).</p>';
          map.flyTo([lat, lng], 18, { duration: 1.2 });
        } else {
          updateDirections();
        }
      }, err => {
        const msg = err.code === 1 ? 'Location permission was denied. Allow location for this page in your browser, then tap 📍 again.'
                  : err.code === 2 ? 'Could not find your location. Make sure location/GPS is turned on.'
                  : 'Finding your location took too long. Please try again.';
        dirResult.innerHTML = `<p class="dir-warn">⚠ ${msg}</p><p class="dir-hint">Note: location only works on https:// links or on localhost, not when the file is opened directly.</p>`;
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
    }
    document.getElementById('dirLocate').onclick = () => locateMe();

    dirFrom.addEventListener('change', () => { if (tracking && dirFrom.value !== 'me') stopTracking(true); updateDirections(tracking); });
    dirTo.addEventListener('change', () => updateDirections(tracking));
    document.getElementById('dirSwap').onclick = () => {
      if (dirFrom.value === 'me') return;
      const t = dirFrom.value; dirFrom.value = dirTo.value; dirTo.value = t; updateDirections();
    };
    document.getElementById('dirClose').onclick = closeDirBox;
    document.getElementById('dirOpenBtn').onclick = () => {
      if (dirBox.classList.contains('show')) closeDirBox(); else { openDirBox(); updateDirections(); }
    };


    // ================= VOICE DIRECTIONS =================
    // Reads the next turn out loud during live tracking. Uses the phone's built-in voice (no library needed).
    let voiceOn = true, lastVoiceKey = '', voiceNowSaid = false;
    try { voiceOn = localStorage.getItem('campusVoice') !== 'off'; } catch (e) {}
    const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

    function speak(text) {
      if (!canSpeak || !voiceOn) return;
      try {
        window.speechSynthesis.cancel();                       // never let old sentences pile up
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-IN'; u.rate = 0.95;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
    function stopSpeaking() { if (canSpeak) { try { window.speechSynthesis.cancel(); } catch (e) {} } }
    function lowerFirst(t) { return t.charAt(0).toLowerCase() + t.slice(1); }

    // called on every live update with the route steps: step 0 = where you are now, step 1 = the next instruction
    function voiceGuide(steps) {
      if (!tracking || !voiceOn || steps.length < 2) return;
      const nx = steps[1], d = steps[0].dist;
      const key = nx.text + '|' + nx.at.lat.toFixed(6);
      if (key !== lastVoiceKey) {                              // a new instruction became the next one
        lastVoiceKey = key; voiceNowSaid = d <= 20;
        speak(d > 20 ? 'In ' + fmtDist(d) + ', ' + lowerFirst(nx.text) : nx.text);
      } else if (d <= 20 && !voiceNowSaid) {                   // you are almost there: say it once more
        voiceNowSaid = true;
        speak(nx.text);
      }
    }
    function toggleVoice() {
      voiceOn = !voiceOn;
      try { localStorage.setItem('campusVoice', voiceOn ? 'on' : 'off'); } catch (e) {}
      if (!voiceOn) stopSpeaking(); else speak('Voice directions on');
      const b = document.getElementById('voiceBtn');
      if (b) b.textContent = voiceOn ? '🔊 Voice: ON' : '🔇 Voice: OFF';
    }

    // ================= LIVE TRACKING =================
    // Watches your GPS, moves the blue dot, re-plans the route from where you are and updates the next-turn card.
    // (Phones only give GPS to https:// pages, so this works on your GitHub link, not on a file opened from disk.)
    function setFollow(v) { follow = v; updateFollowBtn(); }
    function updateFollowBtn() {
      const b = document.getElementById('followBtn');
      if (b) b.textContent = follow ? '🎯 Following you' : '🎯 Recenter';
    }
    function followTo(lat, lng, z) {
      z = z || Math.max(map.getZoom(), 17);
      let target = L.latLng(lat, lng);
      const panel = document.getElementById('panel');
      if (!panel.classList.contains('hidden')) {
        // shift the view so your dot sits in the part of the map that the panel does not cover
        const pt = map.project(target, z);
        if (window.innerWidth <= 700) pt.y += panel.offsetHeight / 2; else pt.x -= (panel.offsetWidth + 14) / 2;
        target = map.unproject(pt, z);
      }
      map.setView(target, z, { animate: true, duration: 0.5 });
    }
    function recenter() {
      setFollow(true);
      if (meDot) { const p = meDot.getLatLng(); followTo(p.lat, p.lng); }
    }
    map.on('dragstart', () => { if (tracking && follow) setFollow(false); });

    async function keepAwake(on) {
      try {
        if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
      } catch (e) {}
