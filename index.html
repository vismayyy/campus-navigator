    function glUpdatePins(pos) {
      glPins.forEach(o => {
        const near = hav(pos, [o.f.lat, o.f.lng]) < GL_PIN_NEAR;
        o.el.classList.toggle('on', o.end || near);
        o.el.classList.toggle('near', near);
      });
    }
    function glSetTrail(coords) {
      const src = gl && gl.getSource('trail');
      if (src) src.setData(lineFeature(coords));
    }

    function startGL() {
      const pts = flyData.pts, p0 = pts[0];
      const theme = document.body.dataset.theme === 'light' ? 'light' : 'dark';
      const a = dirFrom.value === 'me' ? null : Number(dirFrom.value), b = Number(dirTo.value);
      glBear = headingAt(0) ?? 0;
      glFrameNo = 0;
      document.getElementById('map3d').classList.add('show');
      gl = new maplibregl.Map({
        container: 'gl3d',
        style: glStyle(theme, accent2Color(), pts.map(lngLat), beamRing(pts[pts.length - 1])),
        center: lngLat(p0), zoom: flyData.glZoom - 0.7, pitch: 0, bearing: glBear,
        maxPitch: 80, maxZoom: 20, interactive: false, fadeDuration: 0,
        attributionControl: { compact: true }
      });
      gl.on('error', e => console.warn('3D map:', e && e.error && e.error.message));
      gl.on('styleimagemissing', e => {          // draw the little direction arrow used along the route
        if (e.id !== 'routearrow') return;
        const c = document.createElement('canvas'); c.width = c.height = 32;
        const x = c.getContext('2d');
        x.fillStyle = '#ffffff'; x.strokeStyle = 'rgba(0,0,0,.45)'; x.lineWidth = 2; x.lineJoin = 'round';
        x.beginPath(); x.moveTo(9, 6); x.lineTo(25, 16); x.lineTo(9, 26); x.lineTo(14, 16); x.closePath();
        x.stroke(); x.fill();
        try { gl.addImage('routearrow', x.getImageData(0, 0, 32, 32)); } catch (err) {}
      });
      // only the START and END places get a pin in the 3D preview (no other icons)
      glPins = facilities.filter(f => f.id === a || f.id === b).map(f => ({ f, el: glPinEl(f, true), end: true }));
      glMarkers = glPins.map(o => new maplibregl.Marker({ element: o.el, anchor: 'center' })
        .setLngLat([o.f.lng, o.f.lat]).addTo(gl));
      const wrap = document.createElement('div');
      wrap.innerHTML = '<div class="walker"><div class="w-ring"></div><div class="w-shadow"></div><div class="w-dot"></div></div>';
      glWalker = new maplibregl.Marker({ element: wrap, anchor: 'center' }).setLngLat(lngLat(p0)).addTo(gl);

      let started = false;
      const begin = () => {                      // tilt the camera in, then start walking
        if (started || !flyOn || flyMode !== 'gl') return;
        started = true; clearTimeout(glLoadTimer);
        gl.easeTo({ pitch: 54, zoom: flyData.glZoom, bearing: glBear, duration: 1000,
                    padding: { top: Math.round(window.innerHeight * 0.22), bottom: 0, left: 0, right: 0 } });
        flyTimer = setTimeout(() => { if (!flyOn) return; flyLast = performance.now(); flyRaf = requestAnimationFrame(flyFrame); }, 1100);
      };
      gl.once('load', begin);
      glLoadTimer = setTimeout(begin, 7000);     // slow network: start anyway
    }

    function startTilt() {
      const pts = flyData.pts;
      setInteractions(false);
      setTilt(true);
      flyLayer.clearLayers();
      const c2 = accent2Color();
      flyGlow = L.polyline([pts[0]], { color: c2, weight: 16, opacity: 0.35, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(flyLayer);
      flyCore = L.polyline([pts[0]], { color: c2, weight: 6, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(flyLayer);
      flyWalker = L.marker(pts[0], { icon: walkerIcon(), interactive: false, keyboard: false, zIndexOffset: 3000 }).addTo(flyLayer);
      map.setView(pts[0], flyData.zoom, { animate: false });
      flyTimer = setTimeout(() => { if (!flyOn) return; flyLast = performance.now(); flyRaf = requestAnimationFrame(flyFrame); }, 1100);   // after the tilt-in
    }

    function startFly() {
      if (!lastRoute || flyOn) return;
      const pts = pts_of(lastRoute);
      const cum = [0];
      for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + hav(pts[i - 1], pts[i]));
      const total = cum[cum.length - 1];
      if (pts.length < 2 || total < 5) return;
      flyData = { pts, cum, total, idx: 0, dur: Math.min(40, Math.max(7, total / 45)) * 1000,
                  zoom: total < 450 ? 19 : 18, glZoom: total < 450 ? 19 : 18.5 };
      flyOn = true; flyPaused = false; flyDone = false; flyT = 0;
      flySpeed = 1; document.getElementById('flySpeed').textContent = '1×';
      map.closePopup();
      const panel = document.getElementById('panel');
      panelWasHidden = panel.classList.contains('hidden');
      panel.classList.add('hidden');                // full-screen view while it plays
      document.getElementById('flyHud').classList.add('show');
      document.body.classList.add('flying');
      document.getElementById('flyPause').textContent = '⏸';
      flyLabel();
      updateHud(0);
      clearTimeout(flyTimer);
      flyMode = glSupported() ? 'gl' : 'tilt';
      if (flyMode === 'gl') {
        try { startGL(); return; }
        catch (e) { console.warn('Real 3D failed, using the tilted view instead:', e); glTeardown(); flyMode = 'tilt'; }
      }
      flyHideOtherPins([dirFrom.value === 'me' ? null : Number(dirFrom.value), Number(dirTo.value)]);
      startTilt();
    }

    // Fallback (tilted) view uses the normal map, so hide every place icon except the start and end ones
    function flyHideOtherPins(keep) {
      facilities.forEach(f => { const el = markers[f.id] && markers[f.id].getElement(); if (el) el.classList.toggle('fly-hide', !keep.includes(f.id)); });
    }
    function flyShowAllPins() {
      facilities.forEach(f => { const el = markers[f.id] && markers[f.id].getElement(); if (el) el.classList.remove('fly-hide'); });
    }

    function flyFrame(now) {
      if (!flyOn) return;
      const dt = now - flyLast; flyLast = now;
      if (!flyPaused && !flyDone) flyT = Math.min(1, flyT + dt * flySpeed / flyData.dur);
      const p = flyEase(flyT);
      const s = p * flyData.total, pts = flyData.pts, cum = flyData.cum;
      let i = flyData.idx;
      if (cum[i] > s) i = 0;                          // dragged backwards: search again from the start
      while (i < pts.length - 2 && cum[i + 1] < s) i++;
      flyData.idx = i;
      const segLen = (cum[i + 1] - cum[i]) || 1;
      const f = Math.min(1, Math.max(0, (s - cum[i]) / segLen));
      const pos = [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f];

      if (flyMode === 'gl') {
        if (!gl) return;
        glWalker.setLngLat(lngLat(pos));
        if ((glFrameNo++ & 1) === 0 || flyT >= 1) {                       // trail every 2nd frame is plenty
          const trail = pts.slice(0, i + 1).map(lngLat); trail.push(lngLat(pos));
          glSetTrail(trail);
        }
        const target = flyDone ? null : headingAt(s);                     // turn the camera smoothly with the path
        if (target !== null) {
          const d = ((target - glBear + 540) % 360) - 180;
          glBear = (glBear + d * (1 - Math.exp(-dt / 900)) + 360) % 360;
        }
                gl.jumpTo({ center: lngLat(pos), bearing: glBear });
      } else {
        flyWalker.setLatLng(pos);
        const trail = pts.slice(0, i + 1); trail.push(pos);
        flyGlow.setLatLngs(trail); flyCore.setLatLngs(trail);
        // camera: slide the map so the walker stays in the middle
        const off = map.latLngToContainerPoint(pos).subtract(map.getSize().divideBy(2));
        map.panBy(off, { animate: false });
      }

      updateHud(flyT);
      if (flyT < 1) flyLabel(s);
      if (flyT >= 1) {
        flyDone = true;
        document.getElementById('flyPause').textContent = '↻';
        flyLabel();
        if (flyMode !== 'gl') return;
      }
      flyRaf = requestAnimationFrame(flyFrame);
    }

    function flyToggle() {
      if (!flyOn) return;
      if (flyDone) {                                 // replay
        flyDone = false; flyPaused = false; flyT = 0; flyData.idx = 0;
        const a = flyData.pts[0];
        if (flyMode === 'gl' && gl) {
          glBear = headingAt(0) ?? glBear;
          glSetTrail([lngLat(a)]);
          glWalker.setLngLat(lngLat(a));
          gl.jumpTo({ center: lngLat(a), bearing: glBear });
        } else {
          map.setView(a, flyData.zoom, { animate: false });
          flyGlow.setLatLngs([a]); flyCore.setLatLngs([a]); flyWalker.setLatLng(a);
        }
        flyLabel(0);
        flyLast = performance.now();
        cancelAnimationFrame(flyRaf);
        flyRaf = requestAnimationFrame(flyFrame);
      } else {
        flyPaused = !flyPaused;
        flyLast = performance.now();
      }
      document.getElementById('flyPause').textContent = flyDone ? '↻' : (flyPaused ? '▶' : '⏸');
    }

    function stopFly() {
      if (!flyOn) return;
      flyOn = false;
      cancelAnimationFrame(flyRaf); clearTimeout(flyTimer);
      document.getElementById('flyHud').classList.remove('show');
      document.body.classList.remove('flying');
      if (flyMode === 'gl') {
        glTeardown();                                // the flat Leaflet map underneath was never moved
        if (!panelWasHidden) document.getElementById('panel').classList.remove('hidden');
        return;
      }
      flyShowAllPins();
      flyLayer.clearLayers();
      setTilt(false);
      setInteractions(true);
      if (!panelWasHidden) document.getElementById('panel').classList.remove('hidden');
      setTimeout(() => {                             // back to the normal flat view of the whole route
        if (!flyOn && lastRoute) map.fitBounds(L.latLngBounds(pts_of(lastRoute)), { padding: [70, 70], maxZoom: 19 });
      }, 1000);
    }
    document.getElementById('flyPause').onclick = flyToggle;
    document.getElementById('flySpeed').onclick = () => {
      flySpeed = flySpeed === 1 ? 2 : (flySpeed === 2 ? 3 : 1);
      document.getElementById('flySpeed').textContent = flySpeed + '×';
    };
    (function () {                              // drag the bar to jump to any point of the walk
      const sc = document.getElementById('flyScrub');
      let down = false;
      function seek(e) {
        if (!flyOn || !flyData) return;
        const r = sc.getBoundingClientRect();
        flyT = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        if (flyT < 1 && flyDone) {
          flyDone = false;
          document.getElementById('flyPause').textContent = flyPaused ? '▶' : '⏸';
        }
        const s = flyEase(flyT) * flyData.total;
        if (flyMode === 'gl') { const h = headingAt(s); if (h !== null) glBear = h; }
        flyLast = performance.now();
        cancelAnimationFrame(flyRaf);
        flyRaf = requestAnimationFrame(flyFrame);
      }
      sc.addEventListener('pointerdown', e => { down = true; try { sc.setPointerCapture(e.pointerId); } catch (x) {} seek(e); e.preventDefault(); });
      sc.addEventListener('pointermove', e => { if (down) seek(e); });
      const up = () => { down = false; };
      sc.addEventListener('pointerup', up); sc.addEventListener('pointercancel', up);
    })();
    document.getElementById('flyClose').onclick = () => stopFly();
    document.addEventListener('keydown', e => { if (e.key === 'Escape') stopFly(); });

    // ================= NEAREST TO ME =================
    // To add a new button (for example restrooms), add a place with a new type in TYPE and facilities, then add a line here.
    const NEAR_OPTIONS = [
      { label: 'Canteen', emoji: '🍔', type: 'Food' },
      { label: 'Hostel',  emoji: '🏠', type: 'Hostel' },
      { label: 'Library', emoji: '📚', type: 'Library' },
      { label: 'Parking', emoji: '🅿️', type: 'Utility' },
      { label: 'Gate',    emoji: '🚪', type: 'Entrance' },
      { label: 'Temple',  emoji: '🛕', type: 'Temple' },
      { label: 'Auditorium', emoji: '🎭', type: 'Auditorium' }
    ];

    function nearestTo(opt) {
      locateMe(() => {
        openDirBox();
        if (myGap > OFF_CAMPUS) {
          dirResult.innerHTML = `<p class="dir-warn">${T('nearFar', { m: Math.round(myGap), what: nearWhat(opt) })}</p>`;
          return;
        }
        let best = null;
        facilities.filter(f => f.type === opt.type).forEach(f => {
          const r = shortestPath('me', f.id);
          if (r && (!best || r.dist < best.r.dist)) best = { f, r };
        });
        if (!best) { dirResult.innerHTML = `<p class="dir-warn">${T('nearNone', { what: nearWhat(opt) })}</p>`; return; }
        dirFrom.value = 'me';
        dirTo.value = String(best.f.id);
        updateDirections();
        dirResult.insertAdjacentHTML('afterbegin', `<p class="dir-hint">${T('nearBest', { what: nearWhat(opt), name: pname(best.f) })}</p>`);
      });
    }

    function buildNearRow() {
      const row = document.getElementById('nearRow');
      row.querySelectorAll('.chip').forEach(c => c.remove());     // (rebuilt when the language changes)
      NEAR_OPTIONS.forEach(o => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.textContent = o.emoji + ' ' + nearLabel(o);
        b.onclick = () => nearestTo(o);
        row.appendChild(b);
      });
    }

    // ================= SHARE / QR + DIRECT LINKS =================
    // Links look like:  <your link>?place=17     opens that place
    //                   <your link>?from=1&to=17 opens walking directions between two places
    //                   <your link>?to=17&go=1   starts live directions to that place from wherever the person is standing
    const shareModal = document.getElementById('shareModal');
    const qrBox = document.getElementById('qrBox');
    let shareUrl = PUBLIC_URL, shareFile = 'campus-navigator-qr.png';

    function linkTo(params) {
      const base = PUBLIC_URL.split(/[?#]/)[0];
      return base + '?' + new URLSearchParams(params).toString();
    }
    function slug(t) { return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

    function openShare(opts) {
      opts = opts || {};
      shareUrl = opts.url || PUBLIC_URL;
      shareFile = opts.file || 'campus-navigator-qr.png';
      document.getElementById('shareTitle').textContent = opts.title || T('shareTitle');
      document.getElementById('shareDesc').textContent = opts.desc || T('shareDesc');
      document.getElementById('shareUrl').textContent = shareUrl;
      document.getElementById('nativeShareBtn').style.display = navigator.share ? '' : 'none';
      shareModal.classList.add('show');
      qrBox.innerHTML = '';
      try {
        if (!window.QRCode) throw new Error('no QR library');
        new QRCode(qrBox, { text: shareUrl, width: 220, height: 220, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
        document.getElementById('dlQrBtn').style.display = '';
      } catch (e) {
        // backup: online QR image (cannot be downloaded from here)
        qrBox.innerHTML = '<img width="220" height="220" alt="QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&data=' + encodeURIComponent(shareUrl) + '">';
        document.getElementById('dlQrBtn').style.display = 'none';
      }
    }
    function closeShare() { shareModal.classList.remove('show'); }

    function sharePlace(id) {
      const f = facilities.find(x => x.id === id);
      if (!f) return;
      openShare({ url: linkTo({ place: id }), title: '🔗 ' + pname(f), desc: T('sharePlaceDesc', { name: pname(f) }), file: 'qr-' + slug(f.name) + '.png' });
    }
    function shareRoute() {
      const a = dirFrom.value, b = Number(dirTo.value);
      if (!b) return;
      const to = placeName(b), toEn = placeName(b, 'en');      // file names always use the English name
      if (a && a !== 'me') {
        const from = placeName(Number(a)), fromEn = placeName(Number(a), 'en');
        openShare({ url: linkTo({ from: a, to: b }), title: T('shareRouteTitle'), desc: T('shareRouteDesc', { from, to }), file: 'qr-route-' + slug(fromEn) + '-to-' + slug(toEn) + '.png' });
      } else {
        openShare({ url: linkTo({ to: b, go: 1 }), title: T('shareNavTitle', { to }), desc: T('shareNavDesc', { to }), file: 'qr-navigate-' + slug(toEn) + '.png' });
      }
    }

    document.getElementById('shareBtn').onclick = () => openShare();
    document.getElementById('shareClose').onclick = closeShare;
    shareModal.addEventListener('click', e => { if (e.target === shareModal) closeShare(); });

    document.getElementById('copyLinkBtn').onclick = e => {
      const btn = e.currentTarget;
      const done = () => { btn.textContent = T('copied'); setTimeout(() => btn.textContent = T('copyLink'), 1400); };
      const fallback = () => {
        const t = document.createElement('textarea'); t.value = shareUrl; document.body.appendChild(t);
        t.select(); try { document.execCommand('copy'); } catch (err) {} t.remove(); done();
      };
      if (navigator.clipboard) navigator.clipboard.writeText(shareUrl).then(done).catch(fallback); else fallback();
    };
    document.getElementById('nativeShareBtn').onclick = () => {
      if (navigator.share) navigator.share({ title: 'Campus Navigator', text: 'Find your way around APS College of Engineering', url: shareUrl }).catch(() => {});
    };
    document.getElementById('dlQrBtn').onclick = () => {
      const src = qrBox.querySelector('canvas');
      if (!src) return;
      const m = 24, c = document.createElement('canvas');   // add a white border so phones scan it easily
      c.width = src.width + m * 2; c.height = src.height + m * 2;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(src, m, m);
      const a = document.createElement('a');
      a.href = c.toDataURL('image/png'); a.download = shareFile;
      document.body.appendChild(a); a.click(); a.remove();
    };

    // open the right thing when someone arrives through a direct link / QR code
    function openFromLink() {
      let q;
      try { q = new URLSearchParams(location.search); } catch (e) { return; }
      const find = v => facilities.find(f => String(f.id) === String(v));
      const to = find(q.get('to')), from = find(q.get('from')), place = find(q.get('place'));
      if (to) {
        openDirBox();
        dirTo.value = String(to.id);
        if (from && from.id !== to.id) {
          dirFrom.value = String(from.id);
          updateDirections();
        } else {
          setActive(to.id);
          map.flyTo([to.lat, to.lng], 18, { duration: 1 });
          if (q.get('go') === '1') startTracking();
          else dirResult.innerHTML = '<p class="dir-hint">📍 Tap the 📍 button to start from where you are, or choose a starting point (A).</p>';
        }
      } else if (place) {
        selectFacility(place);
      }
    }

    // ================= START =================
    // Admin mode (shows the Path tool): open the app with ?admin=1 once. Use ?admin=0 to switch it off again.
    try {
      const qa = new URLSearchParams(location.search).get('admin');
      if (qa === '1') localStorage.setItem('campusAdmin', '1');
      if (qa === '0') localStorage.removeItem('campusAdmin');
      if (localStorage.getItem('campusAdmin') === '1') document.body.classList.add('admin');
    } catch (e) {}
    document.getElementById('themeBtn').onclick = () => setTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');
    document.getElementById('langBtn').onclick = () => setLang(LANG === 'en' ? 'kn' : 'en');
    document.documentElement.lang = LANG;
    document.title = T('docTitle');
    applyStaticLang();
    updateLangBtn();
    buildChips();
    buildNearRow();
    applyFilter();
    // Automatic theme: bright from 6 AM to 6 PM, dark at night. (The button still switches it by hand until the next change.)
    const autoTheme = () => { const h = new Date().getHours(); return (h >= 6 && h < 18) ? 'light' : 'dark'; };
    let autoPeriod = autoTheme();
    setTheme(autoPeriod);
    setInterval(() => { const p = autoTheme(); if (p !== autoPeriod) { autoPeriod = p; setTheme(p); } }, 60000);
    fitAll();
    updateLabels();
    openFromLink();

    // ================= INSTALLABLE APP (PWA) =================
    // Android Chrome can install with one tap (the browser sends an "install event").
    // iPhones, and links opened inside WhatsApp / Instagram, never send it - so for those the
    // Install button shows simple step-by-step instructions instead. The button hides once installed.
    let installEvent = null;
    const installBtn = document.getElementById('installBtn');
    const installModal = document.getElementById('installModal');
    const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = () => /android/i.test(navigator.userAgent);
    function hideInstall() { installBtn.classList.add('hide'); }
    if (isStandalone()) hideInstall();
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; });
    function showInstallHelp() {
      const key = isIOS() ? 'instIOS' : (isAndroid() ? 'instAndroid' : 'instDesktop');
      document.getElementById('installTitle').textContent = T('instTitle');
      document.getElementById('installSteps').innerHTML = T(key).split('|').map(x => '<li>' + x + '</li>').join('');
      installModal.classList.add('show');
    }
    installBtn.onclick = () => {
      if (installEvent) {
        installEvent.prompt();
        installEvent.userChoice.then(() => { installEvent = null; }).catch(() => {});
      } else {
        showInstallHelp();
      }
    };
    document.getElementById('installClose').onclick = () => installModal.classList.remove('show');
    installModal.addEventListener('click', e => { if (e.target === installModal) installModal.classList.remove('show'); });
    window.addEventListener('appinstalled', () => { installEvent = null; hideInstall(); installModal.classList.remove('show'); });
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
    setInterval(refreshBadges, 60000);
  </script>
</body>
</html>
